<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro | Native</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #theater { flex: 1; position: relative; background: #000; display: flex; flex-direction: column; }
        
        /* NATIVE VIDEO TAG - UNBLOCKABLE */
        video#main-movie { width: 100%; height: 80vh; background: #111; }
        
        .controls { 
            padding: 20px; background: #0a0a0a; display: flex; 
            justify-content: center; gap: 20px; border-top: 2px solid #00ff88;
        }
        
        #sidebar { width: 260px; background: #050505; border-left: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        video.cam { width: 100%; border-radius: 8px; background: #222; transform: scaleX(-1); border: 1px solid #444; }
        .tag { font-size: 10px; color: #00ff88; font-weight: bold; }
        
        button { background: #1a1a1a; border: 1px solid #444; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { border-color: #00ff88; }
    </style>
</head>
<body>
    <div id="theater">
        <video id="main-movie" controls crossorigin="anonymous">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        </video>

        <div class="controls">
            <button onclick="syncAll()" style="background:#00ff88; color:#000; border:none;">⚡ SYNC EVERYONE TO ME</button>
            <button onclick="toggleCam()">📷 TOGGLE CAM</button>
            <button onclick="window.location.href='/'" style="color:#ff4444">EXIT PARTY</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="tag">YOU</div>
        <video id="my-cam" class="cam" autoplay muted playsinline></video>
        <div class="tag">FRIENDS</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const socket = io();
        const peer = new Peer();
        const movie = document.getElementById('main-movie');
        let myStream;

        // 1. CAMERAS (Confirming they stay working in the sidebar)
        async function initCams() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('my-cam').srcObject = myStream;
                peer.on('call', c => { c.answer(myStream); c.on('stream', s => addFriend(s, c.peer)); });
            } catch(e) { console.error("Cam error"); }
        }

        function addFriend(s, id) {
            if(document.getElementById(id)) return;
            const v = document.createElement('video'); v.id = id; v.className = 'cam';
            v.srcObject = s; v.autoplay = true; v.playsinline = true;
            document.getElementById('friend-cams').appendChild(v);
        }

        peer.on('open', id => socket.emit('join-room', roomId, id));
        socket.on('user-connected', id => {
            setTimeout(() => {
                const c = peer.call(id, myStream);
                c.on('stream', s => addFriend(s, id));
            }, 1000);
        });

        // 2. REAL SYNC (Works because we are not inside an iframe)
        function syncAll() {
            socket.emit('sync-event', { 
                roomId, 
                time: movie.currentTime, 
                state: movie.paused ? 'pause' : 'play',
                type: 'master-sync' 
            });
        }

        socket.on('apply-sync', d => {
            if(d.type === 'master-sync') {
                movie.currentTime = d.time;
                d.state === 'play' ? movie.play() : movie.pause();
            }
        });

        function toggleCam() { myStream.getVideoTracks()[0].enabled = !myStream.getVideoTracks()[0].enabled; }
        initCams();
    </script>
</body>
</html>
