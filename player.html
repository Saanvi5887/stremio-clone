<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #theater { flex: 1; position: relative; display: flex; flex-direction: column; }
        #video-container { flex: 1; width:100%; height:100%; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* FIXED CONTROL BAR */
        .controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; background: rgba(0,0,0,0.9); padding: 15px;
            border-radius: 10px; border: 1px solid #00ff88; display: flex; 
            flex-direction: column; gap: 10px; z-index: 1000;
        }
        .row { display: flex; justify-content: center; gap: 15px; }
        
        /* SIDEBAR */
        #sidebar { width: 250px; background: #050505; border-left: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        video { width: 100%; border-radius: 8px; background: #222; transform: scaleX(-1); }
        .tag { font-size: 10px; color: #00ff88; font-weight: bold; text-transform: uppercase; }
        button { background: #222; border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        button:hover { border-color: #00ff88; }
    </style>
</head>
<body>
    <div id="theater">
        <div id="video-container">
            <iframe id="main-player" src="" allowfullscreen></iframe>
        </div>
        
        <div class="controls">
            <div class="row">
                <button onclick="sendSync()" style="background:#00ff88; color:#000; border:none;">⚡ PUSH SYNC TO FRIENDS</button>
                <button onclick="toggleCam()">📷 CAM</button>
                <button onclick="toggleMic()">🎤 MIC</button>
                <button onclick="window.location.href='/'" style="color:red">EXIT</button>
            </div>
            <div id="sync-status" style="font-size:10px; text-align:center; color:#666;">Ready to Sync</div>
        </div>
    </div>

    <div id="sidebar">
        <div class="tag">You</div>
        <video id="my-cam" autoplay muted playsinline></video>
        <div class="tag">Friends</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const imdb = params.get('imdb');
        const socket = io();
        const peer = new Peer();
        let myStream;

        // Set movie source
        document.getElementById('main-player').src = `https://vidsrc.to/embed/movie/${imdb}`;

        // 1. CAMERA LOGIC (The part that worked)
        async function initMedia() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('my-cam').srcObject = myStream;
                peer.on('call', call => {
                    call.answer(myStream);
                    call.on('stream', s => addRemoteStream(s, call.peer));
                });
            } catch (e) { alert("Please allow Camera/Mic access"); }
        }

        function addRemoteStream(stream, id) {
            if (document.getElementById(id)) return;
            const v = document.createElement('video');
            v.id = id; v.srcObject = stream; v.autoplay = true; v.playsinline = true;
            document.getElementById('friend-cams').append(v);
        }

        peer.on('open', id => socket.emit('join-room', roomId, id));
        socket.on('user-connected', userId => {
            setTimeout(() => {
                const call = peer.call(userId, myStream);
                call.on('stream', s => addRemoteStream(s, userId));
            }, 1000);
        });

        // 2. SYNC LOGIC
        // Since we can't "read" the time inside an iframe easily, 
        // the leader manually pushes a sync point.
        function sendSync() {
            // This is a manual trigger because automated iframe-reading is blocked by Chrome/Brave
            socket.emit('sync-event', { roomId, type: 'manual-sync' });
            document.getElementById('sync-status').innerText = "Sync signal sent!";
            setTimeout(() => document.getElementById('sync-status').innerText = "", 2000);
        }

        socket.on('apply-sync', (data) => {
            if (data.type === 'manual-sync') {
                // When the leader clicks PUSH, everyone else's player reloads to catch up
                const player = document.getElementById('main-player');
                const currentSrc = player.src;
                player.src = ""; 
                player.src = currentSrc;
                document.getElementById('sync-status').innerText = "Syncing with leader...";
            }
        });

        function toggleCam() { myStream.getVideoTracks()[0].enabled = !myStream.getVideoTracks()[0].enabled; }
        function toggleMic() { myStream.getAudioTracks()[0].enabled = !myStream.getAudioTracks()[0].enabled; }

        initMedia();
    </script>
</body>
</html>
