<!DOCTYPE html>
<html>
<head>
    <title>Party & Call</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://controls.webtor.io/v1/index.js" charset="utf-8"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #theater { flex: 1; position: relative; background: #000; }
        #video-container { width:100%; height:100%; display: flex; align-items: center; justify-content: center; }
        #sidebar { width: 260px; background: #0a0a0a; border-left: 1px solid #00ff88; display: flex; flex-direction: column; padding: 10px; gap: 10px; overflow-y: auto; }
        video { width: 100%; border-radius: 10px; border: 1px solid #333; background: #000; transform: scaleX(-1); }
        .controls { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #00ff88; z-index: 100; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-toggle { background: #333; color: white; border: 1px solid #00ff88; }
        .btn-exit { background: #ff4444; color: white; }
        iframe { width: 100%; height: 100%; border: none; }
        .status-msg { color: #00ff88; font-family: monospace; }
    </style>
</head>
<body>
    <div id="theater">
        <div id="video-container">
            <div id="loading-text" class="status-msg">STABILIZING STREAM...</div>
        </div>
        <div class="controls">
            <span id="m-title" style="color:#00ff88">Loading...</span>
            <div class="btn-group">
                <button id="cam-btn" class="btn-toggle" onclick="toggleCam()">📷 Camera On</button>
                <button id="mic-btn" class="btn-toggle" onclick="toggleMic()">🎤 Mic On</button>
                <button class="btn-exit" onclick="window.location.href='/'">Exit Theater</button>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div style="font-size: 10px; color:#00ff88;">YOU</div>
        <video id="my-cam" autoplay muted playsinline></video>
        <div style="font-size: 10px; color:#00ff88; margin-top:10px;">FRIENDS</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hash = params.get('hash');
        const imdb = params.get('imdb');
        document.getElementById('m-title').innerText = params.get('title');

        const socket = io();
        const peer = new Peer();
        let myStream;

        // 1. Camera Logic with Toggle
        async function initCamera() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const laptopCam = devices.find(d => d.kind === 'videoinput' && d.label.toLowerCase().includes('integrated'));
                
                myStream = await navigator.mediaDevices.getUserMedia({ 
                    video: laptopCam ? { deviceId: { exact: laptopCam.deviceId } } : true, 
                    audio: true 
                });
                
                document.getElementById('my-cam').srcObject = myStream;

                peer.on('call', call => {
                    call.answer(myStream);
                    handleRemoteStream(call);
                });

                socket.on('user-connected', id => {
                    const call = peer.call(id, myStream);
                    handleRemoteStream(call);
                });
            } catch (err) { console.log("Cam error", err); }
        }

        function toggleCam() {
            const videoTrack = myStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            document.getElementById('cam-btn').innerText = videoTrack.enabled ? "📷 Camera On" : "📷 Camera Off";
            document.getElementById('cam-btn').style.borderColor = videoTrack.enabled ? "#00ff88" : "#ff4444";
        }

        function toggleMic() {
            const audioTrack = myStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            document.getElementById('mic-btn').innerText = audioTrack.enabled ? "🎤 Mic On" : "🎤 Mic Off";
            document.getElementById('mic-btn').style.borderColor = audioTrack.enabled ? "#00ff88" : "#ff4444";
        }

        function handleRemoteStream(call) {
            const vid = document.createElement('video');
            vid.autoplay = true; vid.playsinline = true;
            call.on('stream', s => { vid.srcObject = s; document.getElementById('friend-cams').append(vid); });
        }

        peer.on('open', id => socket.emit('join-room', roomId, id));

        // 2. Movie Engine (Force Play/Pause Buttons)
        function launchFallback() {
            const container = document.getElementById('video-container');
            if (container.innerHTML.includes('iframe')) return; 
            container.innerHTML = `<iframe src="https://vidsrc.me/embed/movie?imdb=${imdb}" allowfullscreen></iframe>`;
        }

        function startTheater() {
            if (typeof window.webtor === 'undefined') { launchFallback(); return; }

            window.webtor.push({
                id: 'video-container',
                hash: hash,
                features: {
                    continue: false, // Prevents "Continue Watching" popup
                    title: false     // We have our own title bar
                },
                onReady: (p) => {
                    // This forces the controls to stay visible or use native browser controls
                    p.on('play', () => socket.emit('sync-event', { roomId, type: 'play', time: p.getCurrentTime() }));
                    p.on('pause', () => socket.emit('sync-event', { roomId, type: 'pause', time: p.getCurrentTime() }));
                    socket.on('apply-sync', (d) => {
                        if (Math.abs(p.getCurrentTime() - d.time) > 2) p.seek(d.time);
                        d.type === 'play' ? p.play() : p.pause();
                    });
                },
                onError: () => launchFallback()
            });
        }

        setTimeout(() => { if (document.getElementById('loading-text')) launchFallback(); }, 6000);
        
        initCamera();
        startTheater();
    </script>
</body>
</html>
