<!DOCTYPE html>
<html>
<head>
    <title>Streaming...</title>
    <style>
        body { background: #000; margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; color: white; }
        #video-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .footer { padding: 20px; background: #111; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: #00ff88; color: black; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div id="video-container">
        <iframe id="movie-frame" src="" allowfullscreen></iframe>
    </div>
    <div class="footer">
        <div id="movie-info">
            <h2 id="movie-title" style="margin:0;">Loading...</h2>
        </div>
        <a href="/app" class="back-btn">Back to Lobby</a>
    </div>

    <script>
        // Get the movie data from the URL
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title');
        const imdbId = params.get('imdb');

        document.getElementById('movie-title').innerText = title || "Now Playing";
        
        // Build the direct streaming link
        if (imdbId) {
            document.getElementById('movie-frame').src = `https://vidsrc.me/embed/movie?imdb=${imdbId}`;
        } else {
            document.getElementById('movie-info').innerText = "Error: No IMDB ID found.";
        }
    </script>
</body>
</html>
