<!DOCTYPE html>
<html>
<head>
    <title>Party Theater</title>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; overflow:hidden; }
        #video-container { width:100vw; height:100vh; }
        .info-bar { position:fixed; bottom:0; width:100%; background:rgba(0,0,0,0.7); padding:10px; display:flex; justify-content:space-between; z-index:100; }
    </style>
</head>
<body>
    <div id="video-container"></div>
    <div class="info-bar">
        <span id="movie-title">Loading...</span>
        <button onclick="window.location.href='/'">Exit Theater</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://controls.webtor.io/v1/index.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hash = params.get('hash');
        document.getElementById('movie-title').innerText = "Watching: " + params.get('title');

        if (roomId) socket.emit('join-room', roomId);

        window.webtor = window.webtor || [];
        window.webtor.push({
            id: 'video-container',
            hash: hash,
            onReady: (player) => {
                // LEADER: When you play/pause, tell the room
                player.on('play', () => {
                    socket.emit('sync-event', { roomId, type: 'play', time: player.getCurrentTime() });
                });

                player.on('pause', () => {
                    socket.emit('sync-event', { roomId, type: 'pause', time: player.getCurrentTime() });
                });

                // FOLLOWER: When a sync event comes from someone else, apply it
                socket.on('apply-sync', (data) => {
                    const diff = Math.abs(player.getCurrentTime() - data.time);
                    if (diff > 1.5) { // Only seek if out of sync by more than 1.5s
                        player.seek(data.time);
                    }
                    data.type === 'play' ? player.play() : player.pause();
                });
            }
        });
    </script>
</body>
</html>
