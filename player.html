<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Party Theater</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #video-container { width: 100vw; height: 100vh; background: #000; }
        .info { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 15px; display: flex; justify-content: space-between; border-top: 1px solid #00ff88; z-index: 1000; }
    </style>
</head>
<body>
    <div id="video-container"></div>
    <div class="info">
        <span id="title">Loading...</span>
        <button onclick="window.location.href='/'" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Exit</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://controls.webtor.io/v1/index.js" charset="utf-8"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        document.getElementById('title').innerText = params.get('title');

        if (roomId) socket.emit('join-room', roomId);

        function start() {
            if (typeof window.webtor === 'undefined') {
                setTimeout(start, 1000);
                return;
            }
            window.webtor.push({
                id: 'video-container',
                hash: params.get('hash'),
                onReady: (p) => {
                    p.on('play', () => socket.emit('sync-event', { roomId, type: 'play', time: p.getCurrentTime() }));
                    p.on('pause', () => socket.emit('sync-event', { roomId, type: 'pause', time: p.getCurrentTime() }));
                    socket.on('apply-sync', (d) => {
                        if (Math.abs(p.getCurrentTime() - d.time) > 2) p.seek(d.time);
                        d.type === 'play' ? p.play() : p.pause();
                    });
                }
            });
        }
        start();
    </script>
</body>
</html>
