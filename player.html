<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://controls.webtor.io/v1/index.js"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #theater { flex: 1; position: relative; background: #000; display: flex; flex-direction: column; }
        #video-container { flex: 1; width:100%; height:100%; position: relative; }
        
        .master-controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 900px; background: rgba(10, 10, 10, 0.95);
            padding: 15px; border-radius: 12px; border: 1px solid #00ff88;
            display: flex; flex-direction: column; gap: 10px; z-index: 10000;
        }
        .scrubber-row { display: flex; align-items: center; gap: 10px; }
        #scrubber { flex: 1; accent-color: #00ff88; cursor: pointer; }
        .time-txt { font-size: 12px; font-family: monospace; color: #00ff88; }
        .btn-row { display: flex; gap: 15px; justify-content: center; align-items: center; }
        
        #sidebar { width: 260px; background: #050505; border-left: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        video { width: 100%; border-radius: 8px; background: #222; transform: scaleX(-1); border: 1px solid #444; }
        .tag { font-size: 10px; color: #00ff88; font-weight: bold; }
        
        button { background: #1a1a1a; border: 1px solid #444; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
        button:hover { border-color: #00ff88; color: #00ff88; }
        .force-sync { background: #00ff88 !important; color: #000 !important; border: none; }
    </style>
</head>
<body>
    <div id="theater">
        <div id="video-container">
            <div id="status" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#00ff88;">ESTABLISHING CONNECTION...</div>
        </div>
        
        <div class="master-controls">
            <div class="scrubber-row">
                <span id="cTime" class="time-txt">0:00</span>
                <input type="range" id="scrubber" value="0" min="0" max="100">
                <span id="tTime" class="time-txt">0:00</span>
            </div>
            <div class="btn-row">
                <button onclick="pToggle()">PLAY / PAUSE</button>
                <button class="force-sync" onclick="requestSync()">FORCE SYNC ⚡</button>
                <button onclick="toggleCam()">📷 CAM</button>
                <button onclick="toggleMic()">🎤 MIC</button>
                <button onclick="window.location.href='/'" style="color:#ff4444">EXIT</button>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div class="tag">YOU</div>
        <video id="my-cam" autoplay muted playsinline></video>
        <div class="tag">FRIENDS</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hash = params.get('hash');
        const socket = io();
        const peer = new Peer();
        let myStream;
        let player = null;

        async function startCam() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('my-cam').srcObject = myStream;
                peer.on('call', call => {
                    call.answer(myStream);
                    call.on('stream', s => renderFriend(s, call.peer));
                });
            } catch (e) { console.log("Cam denied"); }
        }

        function renderFriend(stream, id) {
            if (document.getElementById(id)) return;
            const v = document.createElement('video');
            v.id = id; v.srcObject = stream; v.autoplay = true; v.playsinline = true;
            document.getElementById('friend-cams').append(v);
        }

        peer.on('open', id => socket.emit('join-room', roomId, id));
        socket.on('user-connected', userId => {
            setTimeout(() => {
                const call = peer.call(userId, myStream);
                call.on('stream', s => renderFriend(s, userId));
            }, 1000);
        });

        function pToggle() { if(!player) return; player.isPaused() ? player.play() : player.pause(); }
        function requestSync() { socket.emit('sync-event', { roomId, type: 'request-sync' }); }

        function initMovie() {
            if (typeof window.webtor === 'undefined') {
                document.getElementById('status').innerHTML = "PLAYER BLOCKED. TURN OFF ADBLOCK.";
                return;
            }
            window.webtor.push({
                id: 'video-container',
                hash: hash,
                onReady: (p) => {
                    player = p;
                    document.getElementById('status').style.display = 'none';
                    setInterval(() => {
                        const cur = p.getCurrentTime();
                        const dur = p.getDuration();
                        document.getElementById('cTime').innerText = fmt(cur);
                        document.getElementById('tTime').innerText = fmt(dur);
                        document.getElementById('scrubber').value = (cur / dur) * 100;
                    }, 1000);

                    document.getElementById('scrubber').oninput = (e) => {
                        const time = (e.target.value / 100) * p.getDuration();
                        p.seek(time);
                        socket.emit('sync-event', { roomId, type: 'seek', time });
                    };

                    p.on('play', () => socket.emit('sync-event', { roomId, type: 'play', time: p.getCurrentTime() }));
                    p.on('pause', () => socket.emit('sync-event', { roomId, type: 'pause', time: p.getCurrentTime() }));

                    socket.on('apply-sync', (d) => {
                        if (d.type === 'request-sync') {
                            socket.emit('sync-event', { roomId, type: 'seek', time: p.getCurrentTime() });
                        } else {
                            if (Math.abs(p.getCurrentTime() - d.time) > 2) p.seek(d.time);
                            d.type === 'play' ? p.play() : p.pause();
                        }
                    });
                }
            });
        }

        function fmt(s) { return Math.floor(s/60) + ":" + Math.floor(s%60).toString().padStart(2,'0'); }
        function toggleCam() { myStream.getVideoTracks()[0].enabled = !myStream.getVideoTracks()[0].enabled; }
        function toggleMic() { myStream.getAudioTracks()[0].enabled = !myStream.getAudioTracks()[0].enabled; }

        startCam();
        initMovie();
    </script>
</body>
</html>
