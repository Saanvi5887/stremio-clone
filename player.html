<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro | Aesthetic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f0f12;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-soft: #b8c1ec; /* Soft Periwinkle */
            --text-main: #eef1f5;
            --danger-muted: #e57373;
        }

        body { 
            margin:0; background: var(--bg-dark); color: var(--text-main); 
            font-family: 'Inter', -apple-system, sans-serif; 
            display:flex; height:100vh; overflow:hidden; 
        }

        /* MOVIE SECTION */
        #theater { flex: 1; display: flex; flex-direction: column; position: relative; }
        #player-wrapper { flex: 1; background: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        /* SOFT GLASS CONTROLS */
        .controls { 
            background: rgba(15, 15, 18, 0.9);
            backdrop-filter: blur(15px);
            padding: 18px; display: flex; 
            justify-content: center; gap: 15px; 
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
        }

        .icon-btn {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); 
            color: var(--accent-soft); width: 48px; height: 48px; border-radius: 14px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: all 0.25s ease;
        }
        
        .icon-btn:hover { 
            background: rgba(184, 193, 236, 0.1);
            border-color: var(--accent-soft);
            transform: translateY(-2px);
        }

        .icon-btn.off { 
            background: rgba(229, 115, 115, 0.1); 
            border-color: var(--danger-muted); 
            color: var(--danger-muted); 
        }

        .sync-btn {
            background: var(--accent-soft); color: #232946; 
            padding: 10px 24px; border-radius: 12px; 
            font-weight: 600; border: none; cursor: pointer;
            font-size: 14px; letter-spacing: 0.5px;
            transition: 0.3s ease;
        }
        .sync-btn:hover { opacity: 0.9; transform: scale(1.02); }

        /* SIDEBAR STYLE */
        #sidebar { 
            width: 270px; background: #121216; 
            border-left: 1px solid rgba(255,255,255,0.03); 
            padding: 20px; display: flex; flex-direction: column; gap: 20px; 
        }

        .cam-container { 
            position: relative; width: 100%; 
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        video.cam { width: 100%; transform: scaleX(-1); display: block; background: #1a1a1f; }
        
        .name-tag { 
            position: absolute; bottom: 12px; left: 12px; 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px);
            padding: 4px 14px; border-radius: 10px; 
            font-size: 10px; color: #fff;
            font-weight: 500; border: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 0.5px;
        }

        .section-label {
            font-size: 11px; font-weight: 600; color: #555e7d;
            text-transform: uppercase; letter-spacing: 1.5px;
        }
    </style>
</head>
<body>
    <div id="theater">
        <div id="player-wrapper">
            <iframe id="main-player" src="" allowfullscreen allow="autoplay"></iframe>
        </div>

        <div class="controls">
            <button class="sync-btn" onclick="syncRefresh()">
                <i class="fas fa-magic"></i> Sync Time
            </button>
            <button id="mic-btn" class="icon-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
            <button id="cam-btn" class="icon-btn" onclick="toggleCam()"><i class="fas fa-video"></i></button>
            <button class="icon-btn" style="color:var(--danger-muted)" onclick="window.location.href='/'">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

    <div id="sidebar">
        <div class="section-label">Your Stream</div>
        <div class="cam-container">
            <video id="my-cam" class="cam" autoplay muted playsinline></video>
            <div id="my-name-tag" class="name-tag">You</div>
        </div>
        <div class="section-label">Watching With</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const imdb = params.get('imdb');
        const socket = io();
        
        const userName = prompt("Name yourself:", "Friend") || "Friend";
        document.getElementById('my-name-tag').innerText = userName;

        const peer = new Peer();
        const player = document.getElementById('main-player');
        let myStream;
        let isMicOn = true;
        let isCamOn = true;

        if (imdb) { player.src = `https://vidsrc.to/embed/movie/${imdb}`; }

        async function startCall() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('my-cam').srcObject = myStream;
                peer.on('call', c => {
                    c.answer(myStream);
                    const rName = c.metadata ? c.metadata.userName : "Guest";
                    c.on('stream', s => addFriend(s, c.peer, rName));
                });
            } catch(e) { console.error("Mic/Cam error"); }
        }

        function addFriend(stream, id, name) {
            if (document.getElementById(id)) return;
            const div = document.createElement('div');
            div.className = 'cam-container'; div.id = id;
            div.innerHTML = `<video id="v-${id}" class="cam" autoplay playsinline></video><div class="name-tag">${name}</div>`;
            document.getElementById('friend-cams').appendChild(div);
            document.getElementById(`v-${id}`).srcObject = stream;
        }

        peer.on('open', id => socket.emit('join-room', roomId, id));
        socket.on('user-connected', uId => {
            setTimeout(() => {
                const call = peer.call(uId, myStream, { metadata: { userName: userName } });
                call.on('stream', s => addFriend(s, uId, "Joining..."));
            }, 1000);
        });

        function toggleMic() {
            isMicOn = !isMicOn;
            myStream.getAudioTracks()[0].enabled = isMicOn;
            document.getElementById('mic-btn').classList.toggle('off', !isMicOn);
            document.getElementById('mic-btn').innerHTML = isMicOn ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            myStream.getVideoTracks()[0].enabled = isCamOn;
            document.getElementById('cam-btn').classList.toggle('off', !isCamOn);
            document.getElementById('cam-btn').innerHTML = isCamOn ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
        }

        function syncRefresh() { socket.emit('sync-event', { roomId, type: 'reload' }); }
        socket.on('apply-sync', d => { if (d.type === 'reload') { player.src = player.src; } });

        startCall();
    </script>
</body>
</html>
