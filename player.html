<!DOCTYPE html>
<html>
<head>
    <title>Party Theater Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://controls.webtor.io/v1/index.js" charset="utf-8"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #theater { flex: 1; position: relative; background: #000; display: flex; flex-direction: column; }
        #video-container { flex: 1; width:100%; height:100%; position: relative; }
        
        /* THE NEW PLAYER CONTROLS BAR */
        #custom-controls {
            position: absolute;
            bottom: 80px; /* Sits above the Cam/Mic bar */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10000;
            border: 1px solid #444;
        }

        .progress-row { display: flex; align-items: center; gap: 10px; width: 100%; }
        #progress-bar { flex: 1; cursor: pointer; accent-color: #00ff88; }
        .time-display { font-size: 12px; font-family: monospace; color: #aaa; min-width: 80px; }

        .buttons-row { display: flex; align-items: center; gap: 20px; }
        .play-btn { background: none; border: none; color: #00ff88; font-size: 20px; cursor: pointer; }

        /* THE CAM/MIC BAR */
        .room-bar { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
            background: #111; padding: 10px 20px; border-radius: 50px; border: 1px solid #00ff88;
            display: flex; gap: 20px; z-index: 10001;
        }

        #sidebar { width: 240px; background: #0a0a0a; border-left: 2px solid #00ff88; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        video { width: 100%; border-radius: 8px; transform: scaleX(-1); background: #000; }
        button { background: none; border: none; color: white; cursor: pointer; font-weight: bold; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="theater">
        <div id="video-container">
            <div id="loading" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#00ff88;">LOADING THEATER...</div>
        </div>
        
        <div id="custom-controls">
            <div class="progress-row">
                <span id="current-time" class="time-display">00:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <span id="total-time" class="time-display">00:00</span>
            </div>
            <div class="buttons-row">
                <button class="play-btn" id="master-play-pause">▶</button>
                <span style="font-size: 12px; color: #666;">Party Sync Active</span>
            </div>
        </div>

        <div class="room-bar">
            <button onclick="toggleCam()">📷 Cam</button>
            <button onclick="toggleMic()">🎤 Mic</button>
            <button onclick="window.location.href='/'" style="color:#ff4444">EXIT</button>
        </div>
    </div>

    <div id="sidebar">
        <video id="my-cam" autoplay muted playsinline></video>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const socket = io();
        const peer = new Peer();
        let myStream;
        let playerRef = null;

        // 1. Camera/Mic Logic
        async function initCamera() {
            myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('my-cam').srcObject = myStream;
            peer.on('call', call => {
                call.answer(myStream);
                const vid = document.createElement('video');
                call.on('stream', s => { vid.srcObject = s; vid.autoplay = true; document.getElementById('friend-cams').append(vid); });
            });
            socket.on('user-connected', id => {
                const call = peer.call(id, myStream);
                const vid = document.createElement('video');
                call.on('stream', s => { vid.srcObject = s; vid.autoplay = true; document.getElementById('friend-cams').append(vid); });
            });
        }

        function toggleCam() { myStream.getVideoTracks()[0].enabled = !myStream.getVideoTracks()[0].enabled; }
        function toggleMic() { myStream.getAudioTracks()[0].enabled = !myStream.getAudioTracks()[0].enabled; }

        peer.on('open', id => socket.emit('join-room', roomId, id));

        // 2. Movie Logic & Custom UI Bridge
        function startTheater() {
            if (typeof window.webtor === 'undefined') {
                document.getElementById('video-container').innerHTML = `<iframe src="https://vidsrc.me/embed/movie?imdb=${params.get('imdb')}" allowfullscreen></iframe>`;
                return;
            }
            window.webtor.push({
                id: 'video-container',
                hash: params.get('hash'),
                onReady: (p) => {
                    playerRef = p;
                    document.getElementById('loading').style.display = 'none';

                    // Update UI every second
                    setInterval(() => {
                        const cur = p.getCurrentTime();
                        const dur = p.getDuration();
                        document.getElementById('current-time').innerText = formatTime(cur);
                        document.getElementById('total-time').innerText = formatTime(dur);
                        document.getElementById('progress-bar').value = (cur / dur) * 100;
                    }, 1000);

                    // Custom Controls Actions
                    document.getElementById('master-play-pause').onclick = () => {
                        if (p.isPaused()) { p.play(); } else { p.pause(); }
                    };

                    document.getElementById('progress-bar').oninput = (e) => {
                        const seekTo = (e.target.value / 100) * p.getDuration();
                        p.seek(seekTo);
                    };

                    // SYNC LOGIC
                    p.on('play', () => socket.emit('sync-event', { roomId, type: 'play', time: p.getCurrentTime() }));
                    p.on('pause', () => socket.emit('sync-event', { roomId, type: 'pause', time: p.getCurrentTime() }));
                    socket.on('apply-sync', (d) => {
                        if (Math.abs(p.getCurrentTime() - d.time) > 2) p.seek(d.time);
                        d.type === 'play' ? p.play() : p.pause();
                    });
                }
            });
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return h > 0 ? `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}` : `${m}:${s.toString().padStart(2,'0')}`;
        }

        initCamera();
        startTheater();
    </script>
</body>
</html>
