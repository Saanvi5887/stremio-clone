<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #theater { flex: 1; display: flex; flex-direction: column; }
        #player-wrapper { flex: 1; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* SLEEK ICON CONTROLS */
        .controls { 
            background: #0a0a0a; padding: 15px; display: flex; 
            justify-content: center; gap: 25px; border-top: 1px solid #00ff88;
            align-items: center;
        }
        
        .icon-btn {
            background: #1a1a1a; border: 1px solid #444; color: white;
            width: 45px; height: 45px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 18px; transition: 0.3s;
        }
        .icon-btn:hover { border-color: #00ff88; color: #00ff88; }
        .icon-btn.off { background: #ff4444; border-color: #ff4444; color: white; }
        
        .sync-btn {
            background: #00ff88; color: #000; padding: 10px 20px; 
            border-radius: 5px; font-weight: bold; border: none; cursor: pointer;
        }

        #sidebar { width: 250px; background: #050505; border-left: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .cam-box { width: 100%; border-radius: 8px; background: #222; border: 1px solid #444; overflow: hidden; }
        video.cam { width: 100%; transform: scaleX(-1); display: block; }
        .tag { font-size: 10px; color: #00ff88; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="theater">
        <div id="player-wrapper">
            <iframe id="main-player" src="" allowfullscreen allow="autoplay"></iframe>
        </div>

        <div class="controls">
            <button class="sync-btn" onclick="syncRefresh()"><i class="fas fa-sync-alt"></i> REFRESH PARTY</button>
            
            <button id="mic-btn" class="icon-btn" onclick="toggleMic()">
                <i class="fas fa-microphone"></i>
            </button>
            
            <button id="cam-btn" class="icon-btn" onclick="toggleCam()">
                <i class="fas fa-video"></i>
            </button>

            <button class="icon-btn" style="color:#ff4444" onclick="window.location.href='/'">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </div>

    <div id="sidebar">
        <div class="tag">You</div>
        <div class="cam-box"><video id="my-cam" class="cam" autoplay muted playsinline></video></div>
        <div class="tag">Friends</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const imdb = params.get('imdb');
        const socket = io();
        const peer = new Peer();
        const player = document.getElementById('main-player');
        let myStream;
        let isMicOn = true;
        let isCamOn = true;

        if (imdb) { player.src = `https://vidsrc.to/embed/movie/${imdb}`; }

        async function startCall() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('my-cam').srcObject = myStream;
                peer.on('call', c => { c.answer(myStream); c.on('stream', s => addFriend(s, c.peer)); });
            } catch(e) { console.error("Media error"); }
        }

        function addFriend(stream, id) {
            if (document.getElementById(id)) return;
            const box = document.createElement('div'); box.className = 'cam-box'; box.id = id;
            const v = document.createElement('video'); v.className = 'cam'; v.srcObject = stream; v.autoplay = true; v.playsinline = true;
            box.appendChild(v); document.getElementById('friend-cams').appendChild(box);
        }

        peer.on('open', id => socket.emit('join-room', roomId, id));
        socket.on('user-connected', userId => {
            setTimeout(() => {
                const call = peer.call(userId, myStream);
                call.on('stream', s => addFriend(s, userId));
            }, 1000);
        });

        // TOGGLE FUNCTIONS
        function toggleMic() {
            isMicOn = !isMicOn;
            myStream.getAudioTracks()[0].enabled = isMicOn;
            const btn = document.getElementById('mic-btn');
            btn.classList.toggle('off', !isMicOn);
            btn.innerHTML = isMicOn ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            myStream.getVideoTracks()[0].enabled = isCamOn;
            const btn = document.getElementById('cam-btn');
            btn.classList.toggle('off', !isCamOn);
            btn.innerHTML = isCamOn ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
        }

        function syncRefresh() { socket.emit('sync-event', { roomId, type: 'reload' }); }
        socket.on('apply-sync', d => { if (d.type === 'reload') { player.src = player.src; } });

        startCall();
    </script>
</body>
</html>
