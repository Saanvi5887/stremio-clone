<!DOCTYPE html>
<html>
<head>
    <title>Party Sync | Theater</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f0f12; --accent: #b8c1ec; --card: rgba(255, 255, 255, 0.03); }
        body { margin:0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #theater { flex: 1; display: flex; flex-direction: column; }
        
        /* THE VIDEO PLAYER (Replacing Iframe) */
        video#main-video { width: 100%; height: 100%; background: #000; outline: none; }

        .controls { 
            background: rgba(15, 15, 18, 0.9); backdrop-filter: blur(15px);
            padding: 15px; display: flex; justify-content: center; gap: 20px; 
            border-top: 1px solid rgba(255, 255, 255, 0.05); align-items: center;
        }
        
        .icon-btn {
            background: var(--card); border: 1px solid rgba(255, 255, 255, 0.1); 
            color: var(--accent); width: 45px; height: 45px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        #sidebar { width: 260px; background: #121216; border-left: 1px solid rgba(255,255,255,0.05); padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .cam-box { width: 100%; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        video.cam { width: 100%; transform: scaleX(-1); display: block; }
        .name-tag { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 10px; font-size: 10px; color: var(--accent); }
    </style>
</head>
<body>
    <div id="theater">
        <video id="main-video" controls autoplay playsinline></video>

        <div class="controls">
            <button class="icon-btn" onclick="syncVideo()"><i class="fas fa-sync"></i></button>
            <button id="mic-btn" class="icon-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
            <button id="cam-btn" class="icon-btn" onclick="toggleCam()"><i class="fas fa-video"></i></button>
        </div>
    </div>

    <div id="sidebar">
        <div class="cam-box">
            <video id="my-cam" class="cam" autoplay muted playsinline></video>
            <div id="my-name" class="name-tag">You</div>
        </div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const videoUrl = params.get('videoUrl'); // Receiving the Torrentio link
        const video = document.getElementById('main-video');
        const socket = io();

        if (videoUrl) { video.src = videoUrl; }

        // --- Video Sync Logic ---
        function syncVideo() {
            socket.emit('sync-event', { room: roomId, time: video.currentTime, paused: video.paused });
        }

        socket.on('apply-sync', (data) => {
            if (Math.abs(video.currentTime - data.time) > 1) {
                video.currentTime = data.time;
            }
            if (data.paused) video.pause(); else video.play();
        });

        // --- Camera Logic (Using your working setup) ---
        const peer = new Peer();
        let myStream;
        const name = prompt("Your name:") || "Friend";
        document.getElementById('my-name').innerText = name;

        async function init() {
            myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
            document.getElementById('my-cam').srcObject = myStream;
            peer.on('call', call => {
                call.answer(myStream);
                call.on('stream', stream => addFriend(stream, call.peer, "Guest"));
            });
        }

        function addFriend(stream, id, n) {
            if (document.getElementById(id)) return;
            const div = document.createElement('div');
            div.className = 'cam-box'; div.id = id;
            div.innerHTML = `<video id="v-${id}" class="cam" autoplay playsinline></video><div class="name-tag">${n}</div>`;
            document.getElementById('friend-cams').appendChild(div);
            document.getElementById(`v-${id}`).srcObject = stream;
        }

        peer.on('open', id => socket.emit('join-room', roomId, id));
        socket.on('user-connected', id => {
            const call = peer.call(id, myStream, {metadata: {name: name}});
            call.on('stream', s => addFriend(s, id, "Friend"));
        });

        init();
    </script>
</body>
</html>
