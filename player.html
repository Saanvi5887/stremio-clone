<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro | The Final Fix</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin:0; background:#111; color:#fff; font-family:sans-serif; display:flex; height:100vh; }
        #main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #sidebar { width: 280px; background: #000; border-left: 2px solid #00ff88; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .cam-box { width: 100%; border-radius: 10px; background: #222; border: 1px solid #333; overflow: hidden; }
        video.cam { width: 100%; transform: scaleX(-1); display: block; }
        .tag { font-size: 11px; color: #00ff88; font-weight: bold; margin-bottom: 5px; }
        
        .movie-card { background: #222; padding: 30px; border-radius: 15px; border: 1px solid #00ff88; max-width: 400px; }
        .sync-btn { background: #00ff88; color: #000; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div id="main-content">
        <div class="movie-card">
            <h2 id="m-title">Loading Movie...</h2>
            <p>The internal player was blocked by your browser. Click the button below to open the movie in a new "Sync Tab."</p>
            <a id="movie-link" href="#" target="_blank" class="sync-btn">🚀 OPEN MOVIE TAB</a>
            <p style="font-size: 12px; color: #888; margin-top: 15px;">Tip: Both users click this, then count "3, 2, 1, Play!"</p>
        </div>
    </div>

    <div id="sidebar">
        <div class="tag">🔴 YOU</div>
        <div class="cam-box"><video id="my-cam" class="cam" autoplay muted playsinline></video></div>
        <div class="tag">🟢 FRIENDS</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const imdb = params.get('imdb');
        const title = params.get('title') || "Your Movie";
        const socket = io();
        const peer = new Peer();

        document.getElementById('m-title').innerText = decodeURIComponent(title);
        // We provide a direct link that the browser won't block as a "resource"
        document.getElementById('movie-link').href = `https://vidsrc.to/embed/movie/${imdb}`;

        async function initCams() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('my-cam').srcObject = stream;
                peer.on('call', c => { c.answer(stream); c.on('stream', s => addFriend(s, c.peer)); });
                
                peer.on('open', id => socket.emit('join-room', roomId, id));
                socket.on('user-connected', userId => {
                    setTimeout(() => {
                        const call = peer.call(userId, stream);
                        call.on('stream', s => addFriend(s, userId));
                    }, 1000);
                });
            } catch (e) { alert("Enable camera for the call!"); }
        }

        function addFriend(stream, id) {
            if (document.getElementById(id)) return;
            const box = document.createElement('div'); box.className = 'cam-box'; box.id = id;
            const v = document.createElement('video'); v.className = 'cam'; v.srcObject = stream; v.autoplay = true; v.playsinline = true;
            box.appendChild(v); document.getElementById('friend-cams').appendChild(box);
        }

        initCams();
    </script>
</body>
</html>
