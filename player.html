<!DOCTYPE html>
<html>
<head>
    <title>Stremio Party - Player</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family: sans-serif; overflow: hidden; }
        #player { width:100vw; height:100vh; }
        .overlay { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; z-index: 99; border: 1px solid #00ff88; }
    </style>
</head>
<body>
    <div id="player"></div>
    <div class="overlay">
        <span id="m-title">Loading movie...</span> | 
        <button onclick="window.location.href='/'" style="background:red; color:white; border:none; cursor:pointer;">Exit</button>
    </div>

    <script src="https://controls.webtor.io/v1/index.js" charset="utf-8" async></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hash = params.get('hash');
        document.getElementById('m-title').innerText = params.get('title');

        if(roomId) socket.emit('join-room', roomId);

        window.webtor = window.webtor || [];
        window.webtor.push({
            id: 'player',
            hash: hash,
            onReady: (p) => {
                console.log('Player is ready');
                
                // When you play, tell everyone else
                p.on('play', () => {
                    socket.emit('sync-action', { roomId, type: 'play', time: p.getCurrentTime() });
                });

                // When you pause, tell everyone else
                p.on('pause', () => {
                    socket.emit('sync-action', { roomId, type: 'pause', time: p.getCurrentTime() });
                });

                // Listen for sync from others
                socket.on('apply-sync', (d) => {
                    if (Math.abs(p.getCurrentTime() - d.time) > 2) {
                        p.seek(d.time);
                    }
                    if (d.type === 'play') p.play();
                    else p.pause();
                });
            }
        });
    </script>
</body>
</html>
