<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #theater { flex: 1; position: relative; background: #000; display: flex; flex-direction: column; }
        #video-container { flex: 1; width:100%; height:100%; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .master-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 800px; background: rgba(10, 10, 10, 0.95);
            padding: 15px; border-radius: 15px; border: 1px solid #00ff88;
            display: flex; flex-direction: column; gap: 10px; z-index: 10000;
        }
        .btn-row { display: flex; gap: 15px; justify-content: center; }
        
        #sidebar { width: 250px; background: #050505; border-left: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        video { width: 100%; border-radius: 8px; background: #222; transform: scaleX(-1); }
        button { background: #222; border: 1px solid #444; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        button:hover { border-color: #00ff88; }
    </style>
</head>
<body>
    <div id="theater">
        <div id="video-container">
            <iframe id="movie-player" src="" allowfullscreen></iframe>
        </div>
        
        <div class="master-bar">
            <div class="btn-row">
                <button onclick="toggleCam()">📷 TOGGLE CAM</button>
                <button onclick="toggleMic()">🎤 TOGGLE MIC</button>
                <button onclick="window.location.href='/'" style="color:red">EXIT PARTY</button>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div style="font-size: 10px; color:#00ff88">YOU</div>
        <video id="my-cam" autoplay muted playsinline></video>
        <div style="font-size: 10px; color:#00ff88">FRIENDS</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const imdb = params.get('imdb');
        const socket = io();
        const peer = new Peer();
        let myStream;

        // Set the movie source immediately
        document.getElementById('movie-player').src = `https://vidsrc.me/embed/movie?imdb=${imdb}`;

        async function startMedia() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('my-cam').srcObject = myStream;

                peer.on('call', call => {
                    call.answer(myStream);
                    call.on('stream', s => addFriendVideo(s, call.peer));
                });
            } catch (e) { console.error("Camera error:", e); }
        }

        function addFriendVideo(stream, id) {
            if (document.getElementById(id)) return;
            const v = document.createElement('video');
            v.id = id;
            v.srcObject = stream;
            v.autoplay = true;
            v.playsinline = true;
            document.getElementById('friend-cams').append(v);
        }

        peer.on('open', id => {
            socket.emit('join-room', roomId, id);
        });

        socket.on('user-connected', userId => {
            // Give the other peer a second to stabilize
            setTimeout(() => {
                const call = peer.call(userId, myStream);
                call.on('stream', s => addFriendVideo(s, userId));
            }, 1000);
        });

        function toggleCam() { myStream.getVideoTracks()[0].enabled = !myStream.getVideoTracks()[0].enabled; }
        function toggleMic() { myStream.getAudioTracks()[0].enabled = !myStream.getAudioTracks()[0].enabled; }

        startMedia();
    </script>
</body>
</html>
