<!DOCTYPE html>
<html>
<head>
    <title>Party & Call</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://controls.webtor.io/v1/index.js" charset="utf-8"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #theater { flex: 1; position: relative; background: #000; }
        #video-container { width:100%; height:100%; }
        #sidebar { width: 280px; background: #0a0a0a; border-left: 1px solid #00ff88; display: flex; flex-direction: column; padding: 10px; gap: 10px; overflow-y: auto; }
        video { width: 100%; border-radius: 12px; border: 1px solid #333; background: #000; transform: scaleX(-1); }
        .label { font-size: 11px; color: #00ff88; margin-bottom: 10px; text-transform: uppercase; }
        .controls { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 15px; display: flex; justify-content: space-between; border-top: 1px solid #00ff88; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="theater">
        <div id="video-container">
            <div id="status" style="padding:20px;">Finding Peers...</div>
        </div>
        <div class="controls">
            <span id="m-title" style="font-weight: bold;">Loading...</span>
            <button onclick="window.location.href='/'" style="background:red; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">Exit</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="label">You</div>
        <video id="my-cam" autoplay muted playsinline></video>
        <div class="label">Friends</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hash = params.get('hash');
        const imdb = params.get('imdb');
        document.getElementById('m-title').innerText = params.get('title');

        const socket = io();
        const peer = new Peer();
        const friendContainer = document.getElementById('friend-cams');

        // 1. Camera Logic
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            document.getElementById('my-cam').srcObject = stream;
            peer.on('call', call => {
                call.answer(stream);
                const vid = document.createElement('video');
                call.on('stream', userStream => { vid.srcObject = userStream; vid.autoplay = true; friendContainer.append(vid); });
            });
            socket.on('user-connected', userId => {
                const call = peer.call(userId, stream);
                const vid = document.createElement('video');
                call.on('stream', userStream => { vid.srcObject = userStream; vid.autoplay = true; friendContainer.append(vid); });
            });
        }).catch(err => console.log("Camera blocked or missing"));

        peer.on('open', id => socket.emit('join-room', roomId, id));

        // 2. Movie Fallback Logic
        function useFallback() {
            const container = document.getElementById('video-container');
            if (container.innerHTML.includes('iframe')) return;
            container.innerHTML = `<iframe src="https://vidsrc.me/embed/movie?imdb=${imdb}" allowfullscreen></iframe>`;
        }

        function initMovie() {
            if (typeof window.webtor === 'undefined') { useFallback(); return; }
            window.webtor.push({
                id: 'video-container',
                hash: hash,
                onReady: (p) => {
                    p.on('play', () => socket.emit('sync-event', { roomId, type: 'play', time: p.getCurrentTime() }));
                    p.on('pause', () => socket.emit('sync-event', { roomId, type: 'pause', time: p.getCurrentTime() }));
                    socket.on('apply-sync', (d) => {
                        if (Math.abs(p.getCurrentTime() - d.time) > 2) p.seek(d.time);
                        d.type === 'play' ? p.play() : p.pause();
                    });
                },
                onError: () => useFallback()
            });
        }

        // If it's still "Finding Peers" after 8 seconds, swap to web player
        setTimeout(() => { if (document.getElementById('status')) useFallback(); }, 8000);
        
        initMovie();
    </script>
</body>
</html>
