<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin:0; background:#0a0a0a; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #main-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        /* THE MOVIE BUTTON */
        .movie-box { background: #1a1a1a; padding: 40px; border-radius: 20px; border: 2px solid #00ff88; box-shadow: 0 0 20px rgba(0,255,136,0.2); }
        .play-btn { 
            background: #00ff88; color: #000; padding: 20px 40px; 
            text-decoration: none; font-weight: bold; font-size: 20px; 
            border-radius: 10px; display: inline-block; margin-top: 20px;
        }

        #sidebar { width: 280px; background: #000; border-left: 2px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .cam-box { width: 100%; border-radius: 12px; background: #222; overflow: hidden; border: 1px solid #444; }
        video.cam { width: 100%; transform: scaleX(-1); display: block; }
        .tag { font-size: 11px; color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>
    <div id="main-area">
        <div class="movie-box">
            <h1 id="movie-title">Loading Movie...</h1>
            <p>Brave/Chrome blocked the internal player.</p>
            <p>Click below to open the movie in a new tab!</p>
            <a id="external-link" href="#" target="_blank" class="play-btn">🎬 WATCH MOVIE</a>
            <p style="color: #666; font-size: 12px; margin-top: 20px;">Keep this tab open for the video call!</p>
        </div>
    </div>

    <div id="sidebar">
        <div class="tag">🔴 YOU</div>
        <div class="cam-box"><video id="my-cam" class="cam" autoplay muted playsinline></video></div>
        <div class="tag">🟢 FRIENDS</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const imdb = params.get('imdb');
        const title = params.get('title') || "The Movie";
        
        document.getElementById('movie-title').innerText = decodeURIComponent(title);
        document.getElementById('external-link').href = `https://vidsrc.me/embed/movie?imdb=${imdb}`;

        const socket = io();
        const peer = new Peer();

        async function initCams() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('my-cam').srcObject = stream;
                
                peer.on('call', c => {
                    c.answer(stream);
                    c.on('stream', s => addFriend(s, c.peer));
                });

                peer.on('open', id => socket.emit('join-room', roomId, id));
                socket.on('user-connected', userId => {
                    setTimeout(() => {
                        const call = peer.call(userId, stream);
                        call.on('stream', s => addFriend(s, userId));
                    }, 1000);
                });
            } catch (e) { console.log("Cam failed"); }
        }

        function addFriend(stream, id) {
            if (document.getElementById(id)) return;
            const box = document.createElement('div'); box.className = 'cam-box'; box.id = id;
            const v = document.createElement('video'); v.className = 'cam'; v.srcObject = stream; v.autoplay = true; v.playsinline = true;
            box.appendChild(v); document.getElementById('friend-cams').appendChild(box);
        }

        initCams();
    </script>
</body>
</html>
