<!DOCTYPE html>
<html>
<head>
    <title>Stremio Party - Playing</title>
    <style>
        body { background: #000; margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; color: white; overflow: hidden; }
        #video-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .footer { padding: 15px 30px; background: #111; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; }
        .back-btn { background: #00ff88; color: black; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .server-btn { background: #222; color: #ccc; padding: 8px 15px; border-radius: 5px; border: 1px solid #444; cursor: pointer; margin-left: 10px; font-size: 0.8rem; transition: 0.3s; }
        .server-btn:hover { background: #333; border-color: #00ff88; }
        .server-btn.active { border-color: #00ff88; color: #00ff88; background: #0a251a; }
        .room-badge { background: #1a1a1a; padding: 5px 15px; border-radius: 15px; font-size: 0.8rem; color: #00ff88; border: 1px solid #00ff88; }
    </style>
</head>
<body>
    <div id="video-container">
        <iframe id="movie-frame" src="" allowfullscreen allow="autoplay"></iframe>
    </div>
    
    <div class="footer">
        <div id="movie-info">
            <h2 id="movie-title" style="margin:0; font-size: 1.1rem;">Loading...</h2>
            <div style="margin-top: 8px; display: flex; align-items: center;">
                <span id="room-display"></span>
                <div id="server-list" style="margin-left: 20px;">
                    <button class="server-btn active" onclick="changeServer('vidsrc.pro', this)">Server 1</button>
                    <button class="server-btn" onclick="changeServer('vidsrc.to', this)">Server 2</button>
                    <button class="server-btn" onclick="changeServer('superembed', this)">Server 3</button>
                </div>
            </div>
        </div>
        <a href="/" class="back-btn">Exit Theater</a>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title');
        const imdbId = params.get('imdb');
        const roomId = params.get('room');

        document.getElementById('movie-title').innerText = title || "Now Playing";
        
        if (roomId) {
            document.getElementById('room-display').innerHTML = `<span class="room-badge">Room: ${roomId}</span>`;
            socket.emit('join-room', roomId);
        }

        function changeServer(provider, btn) {
            const frame = document.getElementById('movie-frame');
            
            // UI Cleanup
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Switch Sources
            if (provider === 'vidsrc.pro') {
                frame.src = `https://vidsrc.pro/embed/movie/${imdbId}`;
            } else if (provider === 'vidsrc.to') {
                frame.src = `https://vidsrc.to/embed/movie/${imdbId}`;
            } else {
                frame.src = `https://multiembed.mov/?video_id=${imdbId}&tmdb=0`;
            }
        }

        // Auto-load Server 1
        if (imdbId) {
            changeServer('vidsrc.pro', document.querySelector('.server-btn'));
        } else {
            alert("Error: No IMDB ID found in URL");
        }

        // Stay Synced
        socket.on('start-stream', (data) => {
            if (data.imdb !== imdbId) {
                window.location.href = `/player?imdb=${data.imdb}&title=${encodeURIComponent(data.title)}&room=${roomId}`;
            }
        });
    </script>
</body>
</html>
