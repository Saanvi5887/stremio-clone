<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro | Unified</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        
        /* LEFT SIDE: THE MOVIE */
        #theater { flex: 1; position: relative; display: flex; flex-direction: column; background: #000; }
        #player-wrapper { flex: 1; width: 100%; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* BOTTOM CONTROLS */
        .controls { 
            background: #0a0a0a; padding: 12px; display: flex; 
            justify-content: center; gap: 15px; border-top: 1px solid #00ff88;
            z-index: 100;
        }

        /* RIGHT SIDE: THE VIDEO CALL (CONFIRMED WORKING) */
        #sidebar { width: 250px; background: #050505; border-left: 1px solid #333; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .cam-box { width: 100%; border-radius: 8px; background: #222; border: 1px solid #444; overflow: hidden; }
        video.cam { width: 100%; transform: scaleX(-1); display: block; }
        .tag { font-size: 10px; color: #00ff88; font-weight: bold; text-transform: uppercase; }
        
        button { background: #1a1a1a; border: 1px solid #444; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        button:hover { border-color: #00ff88; color: #00ff88; }
    </style>
</head>
<body>
    <div id="theater">
        <div id="player-wrapper">
            <iframe id="main-player" src="" allowfullscreen allow="autoplay"></iframe>
        </div>

        <div class="controls">
            <button onclick="syncRefresh()" style="background:#00ff88; color:#000; border:none; font-weight:bold;">⚡ SYNC REFRESH</button>
            <button onclick="toggleCam()">📷 CAM</button>
            <button onclick="window.location.href='/'" style="color:#ff4444">EXIT</button>
        </div>
    </div>

    <div id="sidebar">
        <div class="tag">You</div>
        <div class="cam-box"><video id="my-cam" class="cam" autoplay muted playsinline></video></div>
        <div class="tag">Friends</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const imdb = params.get('imdb');
        const socket = io();
        const peer = new Peer();
        const player = document.getElementById('main-player');
        let myStream;

        // Force load the movie using vidsrc.to (most compatible with sidebar)
        if (imdb) {
            player.src = `https://vidsrc.to/embed/movie/${imdb}`;
        }

        // 1. VIDEO CALL LOGIC (Using the code that worked in image_bce7be.jpg)
        async function startCall() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('my-cam').srcObject = myStream;
                peer.on('call', c => { c.answer(myStream); c.on('stream', s => addFriend(s, c.peer)); });
            } catch(e) { alert("Please allow camera access!"); }
        }

        function addFriend(stream, id) {
            if (document.getElementById(id)) return;
            const box = document.createElement('div'); box.className = 'cam-box'; box.id = id;
            const v = document.createElement('video'); v.className = 'cam'; v.srcObject = stream; v.autoplay = true; v.playsinline = true;
            box.appendChild(v); document.getElementById('friend-cams').appendChild(v);
        }

        peer.on('open', id => socket.emit('join-room', roomId, id));
        socket.on('user-connected', userId => {
            setTimeout(() => {
                const call = peer.call(userId, myStream);
                call.on('stream', s => addFriend(s, userId));
            }, 1000);
        });

        // 2. UNIFIED SYNC
        function syncRefresh() {
            socket.emit('sync-event', { roomId, type: 'reload' });
        }

        socket.on('apply-sync', d => {
            if (d.type === 'reload') {
                const current = player.src;
                player.src = ''; 
                player.src = current; // Forces everyone's movie to restart at the same time
            }
        });

        function toggleCam() { myStream.getVideoTracks()[0].enabled = !myStream.getVideoTracks()[0].enabled; }
        startCall();
    </script>
</body>
</html>
