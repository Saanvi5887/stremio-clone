<!DOCTYPE html>
<html>
<head>
    <title>Party & Call</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://controls.webtor.io/v1/index.js" charset="utf-8"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display: flex; overflow:hidden; }
        #main-theater { flex-grow: 1; position: relative; height: 100vh; }
        #video-container { width: 100%; height: 100%; }
        
        /* Video Call Sidebar */
        #call-sidebar { width: 250px; background: #111; border-left: 1px solid #00ff88; display: flex; flex-direction: column; padding: 10px; gap: 10px; overflow-y: auto; }
        video { width: 100%; border-radius: 10px; border: 1px solid #333; background: #000; transform: scaleX(-1); }
        .user-label { font-size: 10px; color: #00ff88; margin-top: -5px; margin-bottom: 5px; }

        .bar { position:fixed; bottom:0; left:0; width: calc(100% - 250px); background:rgba(0,0,0,0.8); padding:15px; display:flex; justify-content:space-between; border-top: 1px solid #00ff88; z-index:100; }
    </style>
</head>
<body>
    <div id="main-theater">
        <div id="video-container"></div>
        <div class="bar">
            <span id="m-title">Loading Movie...</span>
            <button onclick="window.location.href='/'" style="background:red; color:white; border:none; cursor:pointer; padding:5px 10px; border-radius:5px;">Exit</button>
        </div>
    </div>

    <div id="call-sidebar">
        <video id="my-video" autoplay muted playsinline></video>
        <div class="user-label">YOU</div>
        <div id="remote-videos"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hash = params.get('hash');
        document.getElementById('m-title').innerText = params.get('title');

        const socket = io();
        const peer = new Peer(); // Create unique ID for video call
        const myVideo = document.getElementById('my-video');
        const remoteContainer = document.getElementById('remote-videos');
        const peers = {};

        // 1. Setup Camera
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            myVideo.srcObject = stream;

            // Answer incoming calls
            peer.on('call', call => {
                call.answer(stream);
                const video = document.createElement('video');
                call.on('stream', userStream => addRemoteVideo(video, userStream, call.peer));
            });

            socket.on('user-connected', userId => {
                const call = peer.call(userId, stream);
                const video = document.createElement('video');
                call.on('stream', userStream => addRemoteVideo(video, userStream, userId));
                peers[userId] = call;
            });
        });

        function addRemoteVideo(video, stream, id) {
            video.srcObject = stream;
            video.autoplay = true;
            video.id = `vid-${id}`;
            if (!document.getElementById(`vid-${id}`)) {
                remoteContainer.append(video);
                const label = document.createElement('div');
                label.className = 'user-label';
                label.innerText = "FRIEND";
                remoteContainer.append(label);
            }
        }

        peer.on('open', id => {
            socket.emit('join-room', roomId, id);
        });

        socket.on('user-disconnected', userId => {
            if (peers[userId]) peers[userId].close();
            const vid = document.getElementById(`vid-${userId}`);
            if (vid) vid.remove();
        });

        // 2. Setup Movie Engine
        function startMovie() {
            if (typeof window.webtor === 'undefined') { setTimeout(startMovie, 1000); return; }
            window.webtor.push({
                id: 'video-container',
                hash: hash,
                onReady: (p) => {
                    p.on('play', () => socket.emit('sync-event', { roomId, type: 'play', time: p.getCurrentTime() }));
                    p.on('pause', () => socket.emit('sync-event', { roomId, type: 'pause', time: p.getCurrentTime() }));
                    socket.on('apply-sync', (d) => {
                        if (Math.abs(p.getCurrentTime() - d.time) > 2) p.seek(d.time);
                        d.type === 'play' ? p.play() : p.pause();
                    });
                }
            });
        }
        startMovie();
    </script>
</body>
</html>
