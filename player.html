<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Party Theater</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #video-container { width: 100vw; height: 100vh; background: #000; }
        .info-bar { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-top: 1px solid #00ff88; }
        #log-status { font-size: 12px; color: #00ff88; margin-left: 20px; font-family: monospace; }
        button { background: #ff4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="video-container"></div>

    <div class="info-bar">
        <div>
            <span id="movie-title" style="font-weight: bold;">Loading Movie...</span>
            <span id="log-status">Initializing Engine...</span>
        </div>
        <button onclick="window.location.href='/'">Exit Theater</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://controls.webtor.io/v1/index.js" charset="utf-8"></script>

    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hash = params.get('hash');
        const title = params.get('title');

        document.getElementById('movie-title').innerText = "Watching: " + title;
        const statusEl = document.getElementById('log-status');

        if (roomId) socket.emit('join-room', roomId);

        function startWebTor() {
            // Check if WebTor SDK is actually loaded
            if (typeof window.webtor === 'undefined') {
                statusEl.innerText = "Waiting for SDK...";
                setTimeout(startWebTor, 1000);
                return;
            }

            statusEl.innerText = "Connecting to Peers...";
            
            window.webtor.push({
                id: 'video-container',
                hash: hash,
                onReady: (player) => {
                    statusEl.innerText = "STREAM ACTIVE";
                    console.log('Player Ready');

                    // Sync logic
                    player.on('play', () => {
                        socket.emit('sync-event', { roomId, type: 'play', time: player.getCurrentTime() });
                    });

                    player.on('pause', () => {
                        socket.emit('sync-event', { roomId, type: 'pause', time: player.getCurrentTime() });
                    });

                    socket.on('apply-sync', (data) => {
                        const diff = Math.abs(player.getCurrentTime() - data.time);
                        if (diff > 2) player.seek(data.time);
                        data.type === 'play' ? player.play() : player.pause();
                    });
                },
                onError: (e) => {
                    statusEl.innerText = "FAILED: Peer connection lost.";
                    statusEl.style.color = "red";
                }
            });
        }

        // Initialize
        startWebTor();
    </script>
</body>
</html>
