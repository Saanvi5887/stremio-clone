<!DOCTYPE html>
<html>
<head>
    <title>Stremio Party - Playing</title>
    <style>
        body { background: #000; margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; color: white; overflow: hidden; }
        #video-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .footer { padding: 15px 30px; background: #111; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; }
        .back-btn { background: #00ff88; color: black; padding: 10px 20px; border-radius: 20px; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .back-btn:hover { background: #00cc6e; transform: scale(1.05); }
        .room-badge { background: #222; padding: 5px 15px; border-radius: 15px; font-size: 0.8rem; color: #00ff88; border: 1px solid #00ff88; }
    </style>
</head>
<body>
    <div id="video-container">
        <iframe id="movie-frame" src="" allowfullscreen allow="autoplay"></iframe>
    </div>
    
    <div class="footer">
        <div id="movie-info">
            <h2 id="movie-title" style="margin:0; font-size: 1.2rem;">Loading...</h2>
            <div id="room-display" style="margin-top: 5px;"></div>
        </div>
        <a href="/app" class="back-btn">Exit Theater</a>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        
        const title = params.get('title');
        const imdbId = params.get('imdb');
        const roomId = params.get('room');

        // 1. Update UI
        document.getElementById('movie-title').innerText = title || "Now Playing";
        if (roomId) {
            document.getElementById('room-display').innerHTML = `<span class="room-badge">Room: ${roomId}</span>`;
            // 2. IMPORTANT: Re-join the socket room so sync works
            socket.emit('join-room', roomId);
        }

        // 3. Set the Stream Source
        if (imdbId) {
            // Using vidsrc.pro for better compatibility with movie embeds
            document.getElementById('movie-frame').src = `https://vidsrc.pro/embed/movie/${imdbId}`;
        } else {
            document.getElementById('movie-info').innerHTML = "<h2 style='color:red;'>Error: No Movie ID</h2>";
        }

        // 4. Listen for Sync (If someone else changes the movie)
        socket.on('start-stream', (data) => {
            if (data.imdb !== imdbId) {
                // If someone else in the room picks a new movie, everyone switches!
                window.location.href = `/player?imdb=${data.imdb}&title=${encodeURIComponent(data.title)}&room=${roomId}`;
            }
        });
    </script>
</body>
</html>
