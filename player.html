<!DOCTYPE html>
<html>
<head>
    <title>Stremio Party - Player</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://controls.webtor.io/v1/index.js" charset="utf-8"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family: sans-serif; overflow: hidden; }
        #player { width:100vw; height:100vh; background: #000; }
        .overlay { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; z-index: 999; border: 1px solid #00ff88; }
    </style>
</head>
<body>
    <div id="player"></div>
    <div class="overlay">
        <span id="m-title" style="font-weight:bold; color:#00ff88;"></span> | 
        <button onclick="window.location.href='/'" style="background:#ff4444; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Exit</button>
    </div>

    <script>
        const socket = io();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hash = params.get('hash');
        document.getElementById('m-title').innerText = params.get('title');

        if(roomId) socket.emit('join-room', roomId);

        // This function ensures the player initializes correctly
        function initPlayer() {
            if (typeof window.webtor === 'undefined') {
                setTimeout(initPlayer, 500); // Retry if script isn't ready
                return;
            }

            window.webtor.push({
                id: 'player',
                hash: hash,
                onReady: (p) => {
                    console.log('Video Engine Started');
                    
                    p.on('play', () => {
                        socket.emit('sync-event', { roomId, type: 'play', time: p.getCurrentTime() });
                    });

                    p.on('pause', () => {
                        socket.emit('sync-event', { roomId, type: 'pause', time: p.getCurrentTime() });
                    });

                    socket.on('apply-sync', (d) => {
                        const diff = Math.abs(p.getCurrentTime() - d.time);
                        if (diff > 2) p.seek(d.time);
                        d.type === 'play' ? p.play() : p.pause();
                    });
                }
            });
        }

        // Run on load
        window.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
