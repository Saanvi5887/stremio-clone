<!DOCTYPE html>
<html>
<head>
    <title>Party Sync Pro | Cinematic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --neon-green: #00ff88;
            --danger-red: #ff4444;
            --glass-bg: rgba(15, 15, 15, 0.8);
            --border-glow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        body { 
            margin:0; background:#050505; color:#fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display:flex; height:100vh; overflow:hidden; 
        }

        /* THEATER AREA */
        #theater { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        #player-wrapper { 
            flex: 1; position: relative; background: #000; 
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* NEON FLOATING CONTROLS */
        .controls { 
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 20px; display: flex; 
            justify-content: center; gap: 20px; 
            border-top: 1px solid rgba(0, 255, 136, 0.2);
            align-items: center;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 18px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .icon-btn:hover { 
            background: rgba(0, 255, 136, 0.1); 
            border-color: var(--neon-green); 
            color: var(--neon-green);
            transform: translateY(-3px);
            box-shadow: var(--border-glow);
        }

        .icon-btn.off { 
            background: rgba(255, 68, 68, 0.15); 
            border-color: var(--danger-red); 
            color: var(--danger-red); 
        }

        .sync-btn {
            background: var(--neon-green); color: #000; 
            padding: 12px 25px; border-radius: 30px; 
            font-weight: 800; border: none; cursor: pointer;
            letter-spacing: 1px; text-transform: uppercase;
            transition: 0.3s;
        }
        .sync-btn:hover { transform: scale(1.05); box-shadow: var(--border-glow); }

        /* MODERN SIDEBAR */
        #sidebar { 
            width: 280px; background: #0a0a0a; 
            border-left: 1px solid rgba(255,255,255,0.05); 
            padding: 20px; display: flex; flex-direction: column; gap: 20px; 
            overflow-y: auto;
        }

        .cam-container { 
            position: relative; width: 100%; 
            border-radius: 15px; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .cam-container:hover { border-color: var(--neon-green); }

        video.cam { width: 100%; transform: scaleX(-1); display: block; background: #111; }
        
        .name-tag { 
            position: absolute; bottom: 10px; left: 10px; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            padding: 4px 12px; border-radius: 20px; 
            font-size: 11px; color: var(--neon-green);
            font-weight: 700; border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .sidebar-header {
            font-size: 12px; font-weight: 900; color: #444;
            text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: -10px;
        }
    </style>
</head>
<body>
    <div id="theater">
        <div id="player-wrapper">
            <iframe id="main-player" src="" allowfullscreen allow="autoplay"></iframe>
        </div>

        <div class="controls">
            <button class="sync-btn" onclick="syncRefresh()">
                <i class="fas fa-bolt"></i> Sync Party
            </button>
            <button id="mic-btn" class="icon-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
            <button id="cam-btn" class="icon-btn" onclick="toggleCam()"><i class="fas fa-video"></i></button>
            <button class="icon-btn" style="color:var(--danger-red)" onclick="window.location.href='/'">
                <i class="fas fa-power-off"></i>
            </button>
        </div>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">Direct Feed</div>
        <div class="cam-container">
            <video id="my-cam" class="cam" autoplay muted playsinline></video>
            <div id="my-name-tag" class="name-tag">You</div>
        </div>
        <div class="sidebar-header">Squad</div>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const imdb = params.get('imdb');
        const socket = io();
        
        const userName = prompt("Choose your party nickname:", "User") || "User";
        document.getElementById('my-name-tag').innerText = userName;

        const peer = new Peer();
        const player = document.getElementById('main-player');
        let myStream;
        let isMicOn = true;
        let isCamOn = true;

        if (imdb) { player.src = `https://vidsrc.to/embed/movie/${imdb}`; }

        async function startCall() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
                document.getElementById('my-cam').srcObject = myStream;
                peer.on('call', c => {
                    c.answer(myStream);
                    const rName = c.metadata ? c.metadata.userName : "Friend";
                    c.on('stream', s => addFriend(s, c.peer, rName));
                });
            } catch(e) { console.error("Media failed"); }
        }

        function addFriend(stream, id, name) {
            if (document.getElementById(id)) return;
            const container = document.createElement('div');
            container.className = 'cam-container';
            container.id = id;
            container.innerHTML = `<video id="v-${id}" class="cam" autoplay playsinline></video><div class="name-tag">${name}</div>`;
            document.getElementById('friend-cams').appendChild(container);
            document.getElementById(`v-${id}`).srcObject = stream;
        }

        peer.on('open', id => socket.emit('join-room', roomId, id));
        socket.on('user-connected', uId => {
            setTimeout(() => {
                const call = peer.call(uId, myStream, { metadata: { userName: userName } });
                call.on('stream', s => addFriend(s, uId, "Connecting..."));
            }, 1000);
        });

        function toggleMic() {
            isMicOn = !isMicOn;
            myStream.getAudioTracks()[0].enabled = isMicOn;
            const btn = document.getElementById('mic-btn');
            btn.classList.toggle('off', !isMicOn);
            btn.innerHTML = isMicOn ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            myStream.getVideoTracks()[0].enabled = isCamOn;
            const btn = document.getElementById('cam-btn');
            btn.classList.toggle('off', !isCamOn);
            btn.innerHTML = isCamOn ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
        }

        function syncRefresh() { socket.emit('sync-event', { roomId, type: 'reload' }); }
        socket.on('apply-sync', d => { if (d.type === 'reload') { player.src = player.src; } });

        startCall();
    </script>
</body>
</html>
