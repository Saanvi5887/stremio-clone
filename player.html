<!DOCTYPE html>
<html>
<head>
    <title>Theater & Call</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://controls.webtor.io/v1/index.js" charset="utf-8"></script>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; height:100vh; overflow:hidden; }
        #theater { flex: 1; position: relative; background: #000; }
        #video-container { width:100%; height:100%; display: flex; align-items: center; justify-content: center; }
        #sidebar { width: 260px; background: #0a0a0a; border-left: 1px solid #00ff88; display: flex; flex-direction: column; padding: 10px; gap: 10px; }
        video { width: 100%; border-radius: 10px; border: 1px solid #333; background: #000; transform: scaleX(-1); }
        .controls { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 15px; display: flex; justify-content: space-between; border-top: 1px solid #00ff88; z-index: 10; }
        iframe { width: 100%; height: 100%; border: none; }
        .status-msg { color: #00ff88; font-family: monospace; }
    </style>
</head>
<body>
    <div id="theater">
        <div id="video-container">
            <div id="loading-text" class="status-msg">STABLIZING STREAM...</div>
        </div>
        <div class="controls">
            <span id="m-title">Loading...</span>
            <button onclick="window.location.href='/'" style="background:red; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">Exit</button>
        </div>
    </div>

    <div id="sidebar">
        <div style="font-size: 10px; color:#00ff88;">CAMERAS</div>
        <video id="my-cam" autoplay muted playsinline></video>
        <div id="friend-cams"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hash = params.get('hash');
        const imdb = params.get('imdb');
        document.getElementById('m-title').innerText = params.get('title');

        const socket = io();
        const peer = new Peer();

        // 1. Camera Setup
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            document.getElementById('my-cam').srcObject = stream;
            peer.on('call', call => {
                call.answer(stream);
                const vid = document.createElement('video');
                call.on('stream', s => { vid.srcObject = s; vid.autoplay = true; document.getElementById('friend-cams').append(vid); });
            });
            socket.on('user-connected', id => {
                const call = peer.call(id, stream);
                const vid = document.createElement('video');
                call.on('stream', s => { vid.srcObject = s; vid.autoplay = true; document.getElementById('friend-cams').append(vid); });
            });
        }).catch(() => console.log("Cam blocked"));

        peer.on('open', id => socket.emit('join-room', roomId, id));

        // 2. Video Logic with Fallback
        function launchFallback() {
            const container = document.getElementById('video-container');
            if (container.innerHTML.includes('iframe')) return; 
            console.log("Switching to high-speed fallback player...");
            container.innerHTML = `<iframe src="https://vidsrc.me/embed/movie?imdb=${imdb}" allowfullscreen></iframe>`;
        }

        function startTheater() {
            if (typeof window.webtor === 'undefined') { launchFallback(); return; }

            window.webtor.push({
                id: 'video-container',
                hash: hash,
                onReady: (p) => {
                    p.on('play', () => socket.emit('sync-event', { roomId, type: 'play', time: p.getCurrentTime() }));
                    p.on('pause', () => socket.emit('sync-event', { roomId, type: 'pause', time: p.getCurrentTime() }));
                    socket.on('apply-sync', (d) => {
                        if (Math.abs(p.getCurrentTime() - d.time) > 2) p.seek(d.time);
                        d.type === 'play' ? p.play() : p.pause();
                    });
                },
                onError: () => launchFallback()
            });
        }

        // If nothing plays in 5 seconds, force the fallback
        setTimeout(() => {
            if (document.getElementById('loading-text')) launchFallback();
        }, 5000);

        startTheater();
    </script>
</body>
</html>
