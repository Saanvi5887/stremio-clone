<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stremio Clone - Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        body { 
            background: radial-gradient(circle at top, #0a0f0d 0%, #050505 100%); 
            color: #e0e0e0; 
            font-family: 'Inter', sans-serif; 
            padding: 40px; 
            margin: 0; 
            min-height: 100vh; 
        }
        
        h1 { 
            text-align: center; 
            color: #00ff88; 
            font-size: 3rem; 
            text-transform: uppercase; 
            letter-spacing: 8px; 
            margin-bottom: 50px; 
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3); 
        }
        
        .controls-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        
        .input-group { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 25px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
        }
        
        input { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid #444; 
            color: white; 
            padding: 12px 20px; 
            border-radius: 30px; 
            outline: none; 
            width: 180px; 
            margin-bottom: 10px;
        }
        
        button { 
            padding: 12px 25px; 
            border-radius: 30px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            background: #00ff88; 
            color: black; 
            transition: 0.2s; 
            margin: 5px;
        }
        
        button:hover { 
            background: #00cc6e; 
            transform: scale(1.05); 
        }

        .btn-secondary {
            background: #333;
            color: white;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 35px; 
        }
        
        .card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        
        .card:hover { 
            transform: translateY(-10px); 
            border-color: #00ff88; 
        }
        
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card h3 { padding: 15px; font-size: 0.9rem; text-align: center; color: #fff; margin: 0; }

        /* Stream Modal */
        #stream-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #00ff88;
        }
        .stream-item {
            background: #222;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .stream-item:hover { background: #00ff88; color: #000; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h1>STREMIO CLONE</h1>
    
    <div class="controls-container">
        <div class="input-group">
            <input type="text" id="room-input" placeholder="Enter Room ID">
            <button onclick="joinRoom()">Join Room</button>
            <button class="btn-secondary" onclick="createPrivateRoom()">Create New Room</button>
            <p id="room-status" style="font-size: 0.8rem; color: #888; margin-top: 10px;">Not in a room</p>
        </div>
    </div>

    <div id="movie-grid" class="grid">Loading real movies...</div>

    <div id="stream-modal">
        <div class="modal-content">
            <h2 id="modal-title">Select Stream</h2>
            <div id="stream-list"></div>
            <button onclick="closeModal()" style="background:#555; color:white; margin-top:20px;">Close</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = null;

        // Auto-join if user presses Enter in the input
        document.getElementById('room-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });

        function joinRoom() {
            const inputVal = document.getElementById('room-input').value.trim();
            if (!inputVal) return alert("Please enter a Room ID");
            
            currentRoom = inputVal;
            socket.emit('join-room', currentRoom);
            
            document.getElementById('room-status').innerText = "Connected to Room: " + currentRoom;
            document.getElementById('room-status').style.color = "#00ff88";
            console.log("Joined Room:", currentRoom);
        }

        async function createPrivateRoom() {
            try {
                const res = await fetch('/generate-room');
                const data = await res.json();
                document.getElementById('room-input').value = data.roomId;
                joinRoom();
                alert("New Room Created! Share this ID: " + data.roomId);
            } catch (err) {
                alert("Failed to create room. Is server running?");
            }
        }

        async function loadMovies() {
            try {
                const res = await fetch('/trending');
                const movies = await res.json();
                const grid = document.getElementById('movie-grid');
                grid.innerHTML = '';
                movies.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => fetchStreams(m.id, m.title);
                    card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}"><h3>${m.title}</h3>`;
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('movie-grid').innerHTML = "Error loading movies. Check backend console.";
            }
        }

        async function fetchStreams(tmdbId, title) {
    if (!currentRoom) return alert("You must Join or Create a room first!");
    
    document.getElementById('stream-modal').style.display = 'flex';
    const list = document.getElementById('stream-list');
    list.innerHTML = "Searching Torrentio...";

    try {
        // 1. Get detailed movie info to find the IMDB ID
        const tmdbRes = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=d800759469a13ad76fd7f48830a046a8`);
        const data = await tmdbRes.json();
        
        const imdbId = data.imdb_id;

        // Safety Check: If no IMDB ID, we can't search Torrentio
        if (!imdbId) {
            list.innerHTML = "❌ No IMDB ID found for this movie. Try another one!";
            return;
        }

        // 2. Fetch from YOUR server's proxy
        const streamRes = await fetch(`/streams/${imdbId}`);
        
        if (!streamRes.ok) throw new Error("Server responded with error");
        
        const streams = await streamRes.json();
        
        list.innerHTML = '';
        if (!streams || streams.length === 0) {
            list.innerHTML = "No streams found. Torrentio might be down or this movie is too new.";
            return;
        }

        streams.slice(0, 5).forEach(s => {
            const item = document.createElement('div');
            item.className = 'stream-item';
            item.innerHTML = `<strong>${s.name}</strong><br><small>${s.title.split('\n')[0]}</small>`;
            item.onclick = () => {
                socket.emit('play-movie', { 
                    roomId: currentRoom, 
                    infoHash: s.infoHash, 
                    title: title,
                    imdb: imdbId 
                });
            };
            list.appendChild(item);
        });
    } catch (e) { 
        console.error(e);
        list.innerHTML = "⚠️ Error fetching streams. Try refreshing the page or picking a different movie."; 
    }
}

        socket.on('start-stream', (data) => {
            // Send everyone to the player page with the same room ID
            window.location.href = `/player?hash=${data.infoHash}&title=${encodeURIComponent(data.title)}&room=${currentRoom}&imdb=${data.imdb}`;
        });

        function closeModal() { document.getElementById('stream-modal').style.display = 'none'; }
        
        loadMovies();
    </script>
</body>
</html>
