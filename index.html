<!DOCTYPE html>
<html>
<head>
    <title>Watch Party - Lobby</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .card { cursor: pointer; border: 1px solid #333; padding: 10px; border-radius: 8px; transition: 0.3s; }
        .card:hover { border-color: #00ff88; transform: scale(1.05); }
        .card img { width: 100%; border-radius: 4px; }
        #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); align-items:center; justify-content:center; }
        .modal-content { background:#111; padding:20px; border:1px solid #00ff88; width:80%; max-width:400px; }
        .stream-link { background:#222; padding:10px; margin:5px 0; cursor:pointer; display:block; border-radius:4px; }
        .stream-link:hover { background:#00ff88; color:black; }
    </style>
</head>
<body>
    <h1>STREMIO PARTY</h1>
    <div style="margin-bottom: 20px;">
        <input type="text" id="room-id" placeholder="Enter or Create Room ID">
        <button onclick="joinRoom()">Join</button>
        <button onclick="createRoom()">Create New</button>
        <p id="status">Not in a room</p>
    </div>

    <div id="movie-grid" class="grid"></div>

    <div id="modal">
        <div class="modal-content">
            <h3>Choose Quality</h3>
            <div id="stream-list"></div>
            <button onclick="document.getElementById('modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = null;

        function createRoom() {
            const id = Math.random().toString(36).substring(7);
            document.getElementById('room-id').value = id;
            joinRoom();
        }

        function joinRoom() {
            currentRoom = document.getElementById('room-id').value;
            if (!currentRoom) return alert("Enter a Room ID first!");
            socket.emit('join-room', currentRoom);
            document.getElementById('status').innerText = "Connected to: " + currentRoom;
        }

        async function loadTrending() {
            const res = await fetch('/trending');
            const movies = await res.json();
            const grid = document.getElementById('movie-grid');
            movies.forEach(m => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}"><h4>${m.title}</h4>`;
                card.onclick = () => fetchStreams(m.id, m.title);
                grid.appendChild(card);
            });
        }

        async function fetchStreams(tmdbId, title) {
            if (!currentRoom) return alert("Join a room first!");
            const modal = document.getElementById('modal');
            const list = document.getElementById('stream-list');
            modal.style.display = 'flex';
            list.innerHTML = "Fetching...";

            const tmdb = await (await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=d800759469a13ad76fd7f48830a046a8`)).json();
            const streams = await (await fetch(`https://torrentio.strem.fun/stream/movie/${tmdb.imdb_id}.json`)).json();
            
            list.innerHTML = "";
            streams.streams.slice(0, 5).forEach(s => {
                const btn = document.createElement('div');
                btn.className = 'stream-link';
                btn.innerText = s.title.split('\n')[0];
                btn.onclick = () => socket.emit('play-movie', { roomId: currentRoom, hash: s.infoHash, title });
                list.appendChild(btn);
            });
        }

        socket.on('redirect-to-player', (data) => {
            window.location.href = `/player.html?hash=${data.hash}&title=${encodeURIComponent(data.title)}&room=${data.roomId}`;
        });

        loadTrending();
    </script>
</body>
</html>
