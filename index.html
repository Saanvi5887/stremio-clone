<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Sync Pro | Discover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f0f12; --card: rgba(255, 255, 255, 0.03); --accent: #b8c1ec; --text: #eef1f5; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        .search-area { width: 100%; max-width: 600px; margin: 20px 0 40px; display: flex; background: var(--card); padding: 8px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        input { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; outline: none; }
        
        /* MOVIE GRID */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; }
        .movie-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; }
        .movie-card:hover { transform: scale(1.05); border-color: var(--accent); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .title { padding: 10px; font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* OVERLAY FOR LINKS */
        #stream-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 40px 20px; box-sizing: border-box; overflow-y: auto; }
        .stream-list { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
        .stream-item { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .stream-item:hover { border-color: var(--accent); }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; color: var(--accent); }
    </style>
</head>
<body>

    <h1>Party Sync Pro</h1>
    <div class="search-area">
        <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="if(event.key==='Enter') searchMovies()">
    </div>

    <div class="results-grid" id="movieGrid"></div>

    <div id="stream-overlay">
        <span class="close-btn" onclick="closeOverlay()">&times;</span>
        <h2 id="selectedTitle" style="text-align:center; margin-bottom:30px;"></h2>
        <div class="stream-list" id="streamList"></div>
    </div>

    <script>
        // 1. Search for Movies (Visual Grid)
        async function searchMovies() {
            const query = document.getElementById('searchInput').value;
            const grid = document.getElementById('movieGrid');
            const res = await fetch(`https://v3-cinemeta.strem.io/catalog/movie/top/search=${query}.json`);
            const data = await res.json();
            
            grid.innerHTML = '';
            data.metas.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => showStreams(movie.imdb_id, movie.name);
                card.innerHTML = `<img class="poster" src="${movie.poster}"><div class="title">${movie.name}</div>`;
                grid.appendChild(card);
            });
        }

        // 2. Click Movie -> Fetch Torrentio Links (Pure Addon Logic)
        async function showStreams(imdb, name) {
            const overlay = document.getElementById('stream-overlay');
            const list = document.getElementById('streamList');
            document.getElementById('selectedTitle').innerText = `Links for ${name}`;
            overlay.style.display = 'block';
            list.innerHTML = 'Fetching Torrentio links...';

            try {
                const res = await fetch(`https://torrentio.strem.io/stream/movie/${imdb}.json`);
                const data = await res.json();
                list.innerHTML = '';
                
                data.streams.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'stream-item';
                    item.onclick = () => {
                        const room = Math.random().toString(36).substring(7);
                        window.location.href = `/player.html?room=${room}&videoUrl=${encodeURIComponent(s.url)}&title=${encodeURIComponent(name)}`;
                    };
                    item.innerHTML = `<div><b>${s.name}</b><br><small>${s.title.split('\n')[1] || ''}</small></div><i class="fas fa-play-circle"></i>`;
                    list.appendChild(item);
                });
            } catch(e) { list.innerHTML = 'Error loading links.'; }
        }

        function closeOverlay() { document.getElementById('stream-overlay').style.display = 'none'; }
        
        // Initial Trending Load
        fetch('https://v3-cinemeta.strem.io/catalog/movie/top.json').then(r => r.json()).then(d => {
            const grid = document.getElementById('movieGrid');
            d.metas.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => showStreams(movie.imdb_id, movie.name);
                card.innerHTML = `<img class="poster" src="${movie.poster}"><div class="title">${movie.name}</div>`;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
