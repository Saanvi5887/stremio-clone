<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><title>Stremio Party</title>
    <style>
        body { background: #0a0f0d; color: #e0e0e0; font-family: sans-serif; padding: 40px; text-align: center; }
        .input-group { background: #111; padding: 20px; border-radius: 15px; margin-bottom: 30px; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: #00ff88; cursor: pointer; font-weight: bold; margin: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .card { cursor: pointer; border: 1px solid #333; border-radius: 10px; overflow: hidden; padding-bottom: 10px; }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        #stream-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index: 100; }
        .modal-content { background:#111; padding:20px; border-radius:10px; border:1px solid #00ff88; max-width:400px; width:90%; }
        .stream-item { background:#222; padding:10px; margin:5px; border-radius:5px; cursor:pointer; text-align:left; font-size: 13px; border: 1px solid #444; }
        .stream-item:hover { border-color: #00ff88; background: #2a2a2a; }
    </style>
</head>
<body>
    <h1 style="color:#00ff88">STREMIO PARTY</h1>
    <div class="input-group">
        <input type="text" id="room-input" placeholder="Room ID" style="padding:10px; border-radius:20px; border:none;">
        <button onclick="joinRoom()">Join</button>
        <button onclick="createRoom()" style="background:#333; color:#fff">Create New</button>
        <p id="status">Not Connected</p>
    </div>
    <div id="movie-grid" class="grid"></div>

    <div id="stream-modal"><div class="modal-content"><h3>Select Stream</h3><div id="stream-list"></div><button onclick="closeModal()" style="margin-top:10px; background:#444; color:#fff">Close</button></div></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = null;

        function createRoom() {
            const id = Math.random().toString(36).substring(7);
            document.getElementById('room-input').value = id;
            joinRoom();
        }

        function joinRoom() {
            currentRoom = document.getElementById('room-input').value;
            if (!currentRoom) return alert("Enter ID");
            socket.emit('join-room', currentRoom);
            document.getElementById('status').innerText = "In Room: " + currentRoom;
        }

        async function loadMovies() {
            const res = await fetch('/trending');
            const movies = await res.json();
            const grid = document.getElementById('movie-grid');
            movies.forEach(m => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}"><h4>${m.title}</h4>`;
                card.onclick = () => fetchStreams(m.id, m.title);
                grid.appendChild(card);
            });
        }

        async function fetchStreams(tmdbId, title) {
            if (!currentRoom) return alert("Join room first");
            document.getElementById('stream-modal').style.display = 'flex';
            const list = document.getElementById('stream-list');
            list.innerHTML = 'Loading streams...';

            const tmdb = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=d800759469a13ad76fd7f48830a046a8`);
            const data = await tmdb.json();
            const res = await fetch(`https://torrentio.strem.fun/stream/movie/${data.imdb_id}.json`);
            const json = await res.json();
            
            list.innerHTML = '';
            json.streams.slice(0, 8).forEach(s => {
                const div = document.createElement('div');
                div.className = 'stream-item';
                div.innerHTML = `<strong>${s.name}</strong><br>${s.title.split('\n')[0]}`;
                // This is the trigger: Emitting the hash to everyone in the room
                div.onclick = () => socket.emit('play-movie', { roomId: currentRoom, hash: s.infoHash, title });
                list.appendChild(div);
            });
        }

        socket.on('start-stream', d => {
            window.location.href = `/player.html?hash=${d.hash}&title=${encodeURIComponent(d.title)}&room=${d.roomId}`;
        });

        function closeModal() { document.getElementById('stream-modal').style.display='none'; }
        loadMovies();
    </script>
</body>
</html>
