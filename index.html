<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Sync Pro | Discover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0f12;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-soft: #b8c1ec;
            --text-main: #eef1f5;
            --text-dim: #a0a0a8;
        }

        body {
            margin: 0; background: var(--bg-dark); color: var(--text-main);
            font-family: 'Inter', sans-serif; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh; padding: 40px 20px;
        }

        /* HEADER SECTION */
        .header { text-align: center; margin-bottom: 40px; width: 100%; max-width: 600px; }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px; }
        
        .search-container {
            display: flex; gap: 10px; background: var(--card-bg);
            padding: 8px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1; background: transparent; border: none; padding: 12px 15px;
            color: #fff; font-size: 16px; outline: none;
        }

        .search-btn {
            background: var(--accent-soft); color: #232946; border: none;
            padding: 10px 25px; border-radius: 12px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .search-btn:hover { transform: scale(1.05); }

        /* MOVIE GRID */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px; width: 100%; max-width: 1100px; margin-top: 20px;
        }

        .movie-card {
            background: var(--card-bg); border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); transition: all 0.4s ease;
            cursor: pointer; position: relative;
        }

        .movie-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-soft);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .poster {
            width: 100%; aspect-ratio: 2/3; background: #1a1a1f;
            object-fit: cover; display: block;
        }

        .movie-info { padding: 15px; text-align: center; }
        .movie-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-year { font-size: 12px; color: var(--text-dim); }

        /* LOADING STATE */
        #loader { display: none; margin-top: 50px; color: var(--accent-soft); font-size: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Party Sync Pro</h1>
        <div class="search-container">
            <input type="text" id="movieInput" placeholder="Search for a movie or series...">
            <button class="search-btn" onclick="searchMovies()">Search</button>
        </div>
    </div>

    <div id="loader"><i class="fas fa-circle-notch"></i></div>
    <div class="results-grid" id="results">
        </div>

    <script>
        async function searchMovies() {
            const query = document.getElementById('movieInput').value;
            const grid = document.getElementById('results');
            const loader = document.getElementById('loader');

            if (!query) return;

            grid.innerHTML = '';
            loader.style.display = 'block';

            try {
                // Using Stremio's Cinmeta API for the data
                const resp = await fetch(`https://v3-cinemeta.strem.io/catalog/movie/top/search=${query}.json`);
                const data = await resp.json();
                
                loader.style.display = 'none';

                data.metas.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.onclick = () => {
                        const roomId = Math.random().toString(36).substring(7);
                        window.location.href = `/player.html?room=${roomId}&imdb=${movie.imdb_id}&title=${encodeURIComponent(movie.name)}`;
                    };

                    card.innerHTML = `
                        <img class="poster" src="${movie.poster}" alt="${movie.name}">
                        <div class="movie-info">
                            <div class="movie-title">${movie.name}</div>
                            <div class="movie-year">${movie.year || ''}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                loader.style.display = 'none';
                grid.innerHTML = '<p>No movies found. Try another title.</p>';
            }
        }

        // Allow "Enter" key to search
        document.getElementById('movieInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchMovies();
        });
    </script>
</body>
</html>
