<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrentio Party Sync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f0f12;
            --card: rgba(255, 255, 255, 0.04);
            --accent: #b8c1ec;
            --text-dim: #949cba;
        }

        body { 
            margin: 0; background: var(--bg); color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }

        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 28px; letter-spacing: -1px; margin-bottom: 20px; }

        /* SEARCH BAR */
        .search-area {
            display: flex; background: var(--card); border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 500px;
            padding: 5px 15px; margin-bottom: 40px;
        }
        input { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; outline: none; }
        .btn { background: var(--accent); color: #232946; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* LINK SELECTION GRID */
        .stream-grid { width: 100%; max-width: 900px; display: grid; gap: 15px; }
        .stream-item {
            background: var(--card); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px; padding: 18px; display: flex; 
            justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.3s;
        }
        .stream-item:hover { border-color: var(--accent); background: rgba(255,255,255,0.08); transform: translateY(-2px); }
        
        .title-part { font-weight: 600; color: var(--accent); font-size: 15px; margin-bottom: 4px; }
        .detail-part { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
        
        .quality-badge {
            background: rgba(184, 193, 236, 0.1); color: var(--accent);
            padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 12px;
            min-width: 60px; text-align: center;
        }

        #status { margin-top: 20px; color: var(--text-dim); font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Party Sync Pro</h1>
        <div class="search-area">
            <input type="text" id="imdbInput" placeholder="Enter IMDB ID (e.g. tt12042730)">
            <button class="btn" onclick="loadTorrentio()">Explore Links</button>
        </div>
        <p id="status">Ready to fetch streams from Torrentio Addon...</p>
    </div>

    <div class="stream-grid" id="streamContainer"></div>

    <script>
        async function loadTorrentio() {
            const imdb = document.getElementById('imdbInput').value.trim();
            const container = document.getElementById('streamContainer');
            const status = document.getElementById('status');

            if (!imdb.startsWith('tt')) {
                status.innerText = "❌ Please enter a valid IMDB ID.";
                return;
            }

            status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Fetching Addon Data...';
            container.innerHTML = '';

            try {
                // This talks directly to the Torrentio Addon Server
                const response = await fetch(`https://torrentio.strem.io/stream/movie/${imdb}.json`);
                const data = await response.json();

                if (!data.streams || data.streams.length === 0) {
                    status.innerText = "No streams found for this content.";
                    return;
                }

                status.innerText = `Found ${data.streams.length} links for ${imdb}`;

                data.streams.forEach(stream => {
                    const div = document.createElement('div');
                    div.className = 'stream-item';
                    
                    // Parsing Torrentio's multi-line title data
                    const lines = stream.title.split('\n');
                    const mainTitle = lines[0];
                    const metadata = lines.slice(1).join(' | ');

                    div.onclick = () => {
                        const room = Math.random().toString(36).substring(7);
                        // Send the actual stream link to our player
                        window.location.href = `/player.html?room=${room}&videoUrl=${encodeURIComponent(stream.url)}&title=${encodeURIComponent(mainTitle)}`;
                    };

                    div.innerHTML = `
                        <div style="flex: 1; padding-right: 20px;">
                            <div class="title-part">${mainTitle}</div>
                            <div class="detail-part">${metadata}</div>
                        </div>
                        <div class="quality-badge">${stream.name}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                status.innerText = "❌ Error connecting to Torrentio. Check your connection.";
            }
        }
    </script>
</body>
</html>
