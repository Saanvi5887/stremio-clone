<!DOCTYPE html>
<html>
<head>
    <title>Stremio Party - Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { background: #0a0f0d; color: #e0e0e0; font-family: 'Inter', sans-serif; padding: 40px; text-align: center; }
        h1 { color: #00ff88; letter-spacing: 5px; text-transform: uppercase; }
        .input-group { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 15px; border: 1px solid #333; max-width: 500px; margin: 0 auto 40px; }
        input { background: #000; border: 1px solid #444; color: white; padding: 12px; border-radius: 30px; width: 150px; outline: none; }
        button { padding: 12px 25px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; background: #00ff88; color: black; margin: 5px; transition: 0.3s; }
        button:hover { transform: scale(1.05); background: #00cc6e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        .card { background: #111; border: 1px solid #222; border-radius: 15px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: #00ff88; transform: translateY(-5px); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index: 100; align-items:center; justify-content:center; }
        .modal-content { background:#111; padding:30px; border-radius:20px; border:1px solid #00ff88; width:90%; max-width:400px; }
        .stream-item { background:#222; padding:15px; margin:10px 0; border-radius:10px; cursor:pointer; text-align:left; font-size: 14px; }
        .stream-item:hover { background: #00ff88; color: black; }
    </style>
</head>
<body>
    <h1>STREMIO PARTY</h1>
    <div class="input-group">
        <input type="text" id="room-id" placeholder="Room ID">
        <button onclick="joinRoom()">Join Room</button>
        <button onclick="createRoom()" style="background:#333; color:white;">Create Room</button>
        <p id="status" style="font-size: 0.8rem; color: #888; margin-top:10px;">Not Connected</p>
    </div>
    <div id="movie-grid" class="grid"></div>

    <div id="modal"><div class="modal-content"><h3>Select Stream</h3><div id="stream-list"></div><button onclick="document.getElementById('modal').style.display='none'" style="background:#444; color:white;">Cancel</button></div></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoom = null;

        function createRoom() {
            const id = Math.random().toString(36).substring(7);
            document.getElementById('room-id').value = id;
            joinRoom();
        }

        function joinRoom() {
            currentRoom = document.getElementById('room-id').value;
            if (!currentRoom) return alert("Enter ID");
            socket.emit('join-room', currentRoom);
            document.getElementById('status').innerText = "Connected: " + currentRoom;
            document.getElementById('status').style.color = "#00ff88";
        }

        async function loadMovies() {
            const res = await fetch('/trending');
            const movies = await res.json();
            const grid = document.getElementById('movie-grid');
            movies.forEach(m => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}"><h4>${m.title}</h4>`;
                card.onclick = () => fetchStreams(m.id, m.title);
                grid.appendChild(card);
            });
        }

        async function fetchStreams(tmdbId, title) {
            if (!currentRoom) return alert("Join room first");
            document.getElementById('modal').style.display = 'flex';
            const list = document.getElementById('stream-list');
            list.innerHTML = "Fetching links...";

            const tmdb = await (await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=d800759469a13ad76fd7f48830a046a8`)).json();
            const res = await fetch(`https://torrentio.strem.fun/stream/movie/${tmdb.imdb_id}.json`);
            const json = await res.json();
            
            list.innerHTML = '';
            json.streams.slice(0, 6).forEach(s => {
                const div = document.createElement('div');
                div.className = 'stream-item';
                div.innerHTML = `<strong>${s.name}</strong><br>${s.title.split('\n')[0]}`;
                div.onclick = () => socket.emit('play-movie', { roomId: currentRoom, hash: s.infoHash, title });
                list.appendChild(div);
            });
        }

        socket.on('redirect-to-player', d => {
            window.location.href = `/player.html?hash=${d.hash}&title=${encodeURIComponent(d.title)}&room=${d.roomId}`;
        });

        loadMovies();
    </script>
</body>
</html>
