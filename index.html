<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Sync Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f0f12; --card: rgba(255, 255, 255, 0.03); --accent: #b8c1ec; --text: #eef1f5; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* Your Original Grid Layout */
        .search-box { width: 100%; max-width: 600px; display: flex; background: var(--card); padding: 8px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin: 40px 0; }
        input { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; outline: none; font-size: 16px; }
        .search-btn { background: var(--accent); color: #232946; border: none; padding: 10px 25px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 25px; width: 100%; max-width: 1200px; }
        .movie-card { background: var(--card); border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; position: relative; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .info { padding: 10px; text-align: center; background: rgba(0,0,0,0.8); position: absolute; bottom: 0; width: 100%; box-sizing: border-box; font-size: 12px; }

        /* Overlay for Torrentio Links */
        #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(10,10,12,0.98); backdrop-filter: blur(20px); z-index: 1000; padding: 50px 20px; overflow-y: auto; }
        .stream-card { background: rgba(255,255,255,0.05); margin-bottom: 12px; padding: 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .stream-card:hover { border-color: var(--accent); }
    </style>
</head>
<body>

    <h1>Party Sync <span>Pro</span></h1>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Search for movies..." onkeyup="if(event.key==='Enter') search()">
        <button class="search-btn" onclick="search()">Search</button>
    </div>

    <div class="results-grid" id="grid"></div>

    <div id="overlay">
        <div style="max-width:700px; margin:0 auto; position:relative;">
            <span style="position:absolute; top:-40px; right:0; font-size:40px; cursor:pointer; color:var(--accent);" onclick="closeOverlay()">&times;</span>
            <h2 id="m-title" style="text-align:center;"></h2>
            <div id="streams"></div>
        </div>
    </div>

    <script>
        // Load the initial grid
        async function init() {
            const res = await fetch('https://v3-cinemeta.strem.io/catalog/movie/top.json');
            const data = await res.json();
            render(data.metas);
        }

        async function search() {
            const q = document.getElementById('query').value;
            if(!q) return;
            const res = await fetch(`https://v3-cinemeta.strem.io/catalog/movie/top/search=${encodeURIComponent(q)}.json`);
            const data = await res.json();
            render(data.metas);
        }

        function render(movies) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            movies.forEach(m => {
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.onclick = () => getLinks(m.imdb_id, m.name, m.type);
                div.innerHTML = `<img class="poster" src="${m.poster}"><div class="info">${m.name}</div>`;
                grid.appendChild(div);
            });
        }

        // FIXED: This gets Torrentio links through your server bridge
        async function getLinks(id, name, type) {
            document.getElementById('m-title').innerText = name;
            document.getElementById('overlay').style.display = 'block';
            const streamsDiv = document.getElementById('streams');
            streamsDiv.innerHTML = '<p style="text-align:center;">🔍 Fetching streams...</p>';

            const cleanId = id.startsWith('tt') ? id : `tt${id}`;
            let target = `https://torrentio.strem.io/stream/${type}/${cleanId}.json`;

            try {
                // This talks to your index.js bridge
                const response = await fetch(`/fetch-links?url=${encodeURIComponent(target)}`);
                const data = await response.json();
                
                streamsDiv.innerHTML = '';
                if (!data.streams || data.streams.length === 0) {
                    streamsDiv.innerHTML = '<p style="text-align:center;">No streams found for this title.</p>';
                    return;
                }

                data.streams.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'stream-card';
                    card.onclick = () => window.location.href = s.url;
                    card.innerHTML = `<div><b>${s.name}</b><br><small>${s.title.split('\n')[0]}</small></div>`;
                    streamsDiv.appendChild(card);
                });
            } catch (err) {
                streamsDiv.innerHTML = '<p style="text-align:center; color:red;">Connection error.</p>';
            }
        }

        function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }
        init();
    </script>
</body>
</html>
