<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Sync Pro | Discover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0f12;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-soft: #b8c1ec;
            --text-main: #eef1f5;
            --text-dim: #a0a0a8;
        }

        body {
            margin: 0; background: var(--bg-dark); color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 0;
        }

        /* TOP NAV BAR */
        nav {
            width: 100%; padding: 20px 50px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 0; z-index: 100; background: rgba(15, 15, 18, 0.8);
        }
        .logo { font-size: 20px; font-weight: 800; letter-spacing: -1px; color: var(--accent-soft); }

        .search-wrapper {
            display: flex; background: rgba(255,255,255,0.05);
            padding: 5px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            width: 400px; transition: 0.3s;
        }
        .search-wrapper:focus-within { border-color: var(--accent-soft); background: rgba(255,255,255,0.08); }
        .search-wrapper input {
            background: transparent; border: none; padding: 10px; color: #fff;
            width: 100%; outline: none; font-size: 14px;
        }
        .search-wrapper i { align-self: center; color: var(--text-dim); }

        /* HERO / RESULTS SECTION */
        .content { width: 100%; max-width: 1200px; padding: 40px 20px; box-sizing: border-box; }
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 30px; letter-spacing: -0.5px; }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
        }

        .movie-card {
            background: var(--card-bg); border-radius: 18px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; position: relative;
        }
        .movie-card:hover {
            transform: scale(1.05); border-color: var(--accent-soft);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #1a1a1f; }
        
        .movie-info { padding: 15px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
        .movie-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-meta { font-size: 11px; color: var(--accent-soft); margin-top: 4px; }

        #loader { display: none; text-align: center; padding: 50px; font-size: 30px; color: var(--accent-soft); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">PARTY SYNC PRO</div>
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="movieSearch" placeholder="Search for a movie..." onkeyup="if(event.key==='Enter') search()">
        </div>
        <div style="width: 100px;"></div> </nav>

    <div class="content">
        <h2 id="view-title" class="section-title">Trending Movies</h2>
        <div id="loader"><i class="fas fa-spinner fa-spin"></i></div>
        <div class="results-grid" id="grid">
            </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const loader = document.getElementById('loader');

        async function fetchTrending() {
            loader.style.display = 'block';
            try {
                const res = await fetch('https://v3-cinemeta.strem.io/catalog/movie/top.json');
                const data = await res.json();
                renderMovies(data.metas);
            } catch (e) { console.error(e); }
        }

        async function search() {
            const query = document.getElementById('movieSearch').value;
            if(!query) return;
            grid.innerHTML = '';
            loader.style.display = 'block';
            document.getElementById('view-title').innerText = `Results for "${query}"`;
            
            try {
                const res = await fetch(`https://v3-cinemeta.strem.io/catalog/movie/top/search=${query}.json`);
                const data = await res.json();
                renderMovies(data.metas);
            } catch (e) { grid.innerHTML = 'No movies found.'; }
        }

        function renderMovies(movies) {
            loader.style.display = 'none';
            grid.innerHTML = '';
            movies.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => {
                    const room = Math.random().toString(36).substring(7);
                    window.location.href = `/player.html?room=${room}&imdb=${m.imdb_id}&title=${encodeURIComponent(m.name)}`;
                };
                card.innerHTML = `
                    <img class="poster" src="${m.poster}" onerror="this.src='https://via.placeholder.com/200x300?text=No+Poster'">
                    <div class="movie-info">
                        <div class="movie-title">${m.name}</div>
                        <div class="movie-meta">${m.year || ''}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        fetchTrending(); // Initial load
    </script>
</body>
</html>
