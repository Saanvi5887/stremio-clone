<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Sync Pro | Theater</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f0f12; --card: rgba(255, 255, 255, 0.03); --accent: #b8c1ec; --text: #eef1f5; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: 'Inter', sans-serif; display: flex; flex-direction: column; 
            align-items: center; min-height: 100vh; padding: 20px; 
        }

        .header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 36px; letter-spacing: -1.5px; font-weight: 800; margin-bottom: 10px; }
        h1 span { color: var(--accent); }

        /* SEARCH INTERFACE */
        .search-area { 
            width: 100%; max-width: 600px; display: flex; background: var(--card); 
            padding: 8px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); 
            margin-bottom: 50px; backdrop-filter: blur(10px);
        }
        input { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; outline: none; font-size: 16px; }
        .search-btn { background: var(--accent); color: #232946; border: none; padding: 10px 25px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* MOVIE GRID DISPLAY */
        .results-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 30px; width: 100%; max-width: 1200px; 
        }
        .movie-card { 
            background: var(--card); border-radius: 20px; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.05); cursor: pointer; 
            transition: 0.3s ease; position: relative;
        }
        .movie-card:hover { transform: translateY(-10px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .info { 
            padding: 15px; text-align: center; 
            background: linear-gradient(transparent, rgba(0,0,0,0.9)); 
            position: absolute; bottom: 0; width: 100%; box-sizing: border-box;
        }
        .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* OVERLAY FOR STREAM SELECTION */
        #overlay { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(10,10,12,0.98); backdrop-filter: blur(20px); z-index: 1000; 
            padding: 50px 20px; box-sizing: border-box; overflow-y: auto; 
        }
        .overlay-content { max-width: 700px; margin: 0 auto; }
        .close-btn { position: absolute; top: 25px; right: 35px; font-size: 35px; cursor: pointer; color: var(--accent); }

        .stream-item { 
            background: rgba(255,255,255,0.04); margin-bottom: 12px; padding: 20px; 
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; 
            transition: 0.2s;
        }
        .stream-item:hover { border-color: var(--accent); background: rgba(184, 193, 236, 0.08); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Party<span>Sync</span> Pro</h1>
    </div>
    
    <div class="search-area">
        <input type="text" id="searchInput" placeholder="Search for movies or series..." onkeyup="if(event.key==='Enter') search()">
        <button class="search-btn" onclick="search()">Search</button>
    </div>

    <div class="results-grid" id="movieGrid">
        </div>

    <div id="overlay">
        <span class="close-btn" onclick="closeOverlay()">&times;</span>
        <div class="overlay-content">
            <h2 id="selectedMovieTitle" style="text-align: center; margin-bottom: 30px; font-size: 28px;"></h2>
            <div id="streamList"></div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('movieGrid');
        const overlay = document.getElementById('overlay');
        const streamList = document.getElementById('streamList');

        // Initial Load: Fetch Trending Movies automatically
        window.onload = async () => {
            grid.innerHTML = '<p>Loading trending movies...</p>';
            try {
                const res = await fetch('https://v3-cinemeta.strem.io/catalog/movie/top.json');
                const data = await res.json();
                renderMovies(data.metas);
            } catch (e) {
                grid.innerHTML = '<p>Failed to load trending content. Check your connection.</p>';
            }
        };

        async function search() {
            const query = document.getElementById('searchInput').value;
            if(!query) return;
            grid.innerHTML = '<p>Searching...</p>';
            try {
                const res = await fetch(`https://v3-cinemeta.strem.io/catalog/movie/top/search=${encodeURIComponent(query)}.json`);
                const data = await res.json();
                renderMovies(data.metas);
            } catch(e) { grid.innerHTML = '<p>Search service is currently unavailable.</p>'; }
        }

        function renderMovies(movies) {
            grid.innerHTML = '';
            if (!movies || movies.length === 0) {
                grid.innerHTML = '<p>No results found.</p>';
                return;
            }
            movies.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => fetchStreams(m.imdb_id, m.name, m.type);
                card.innerHTML = `
                    <img class="poster" src="${m.poster || 'https://via.placeholder.com/300x450?text=No+Poster'}">
                    <div class="info"><div class="title">${m.name}</div></div>
                `;
                grid.appendChild(card);
            });
        }

        async function fetchStreams(id, name, type) {
            document.getElementById('selectedMovieTitle').innerText = name;
            overlay.style.display = 'block';
            streamList.innerHTML = '<p style="text-align:center;">Fetching links from Torrentio...</p>';
            
            let season = 1, episode = 1;
            if (type === 'series') {
                season = prompt("Enter Season number:", "1") || 1;
                episode = prompt("Enter Episode number:", "1") || 1;
            }

            try {
                // Using CORS proxy to prevent browser blocking
                const proxy = "https://corsproxy.io/?";
                const api = type === 'movie' 
                    ? `https://torrentio.strem.io/stream/movie/${id}.json`
                    : `https://torrentio.strem.io/stream/series/${id}:${season}:${episode}.json`;

                const res = await fetch(proxy + encodeURIComponent(api));
                const data = await res.json();
                
                streamList.innerHTML = '';
                if(!data.streams || data.streams.length === 0) {
                    streamList.innerHTML = '<p style="text-align:center;">No streams found for this selection. Try another quality.</p>';
                    return;
                }

                data.streams.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'stream-item';
                    const details = s.title.split('\n');
                    
                    item.onclick = () => {
                        const room = Math.random().toString(36).substring(7);
                        window.location.href = `/player.html?room=${room}&videoUrl=${encodeURIComponent(s.url)}&title=${encodeURIComponent(name)}`;
                    };

                    item.innerHTML = `
                        <div style="flex:1; padding-right:15px;">
                            <div style="font-weight:700; color:var(--accent); margin-bottom:5px;">${details[0]}</div>
                            <div style="font-size:11px; color:#888;">${details[1] || 'Direct Stream'}</div>
                        </div>
                        <div style="font-weight:900; font-size:11px; background:rgba(184,193,236,0.1); padding:6px 12px; border-radius:10px; color:var(--accent);">
                            ${s.name}
                        </div>
                    `;
                    streamList.appendChild(item);
                });
            } catch(e) { streamList.innerHTML = '<p style="text-align:center;">Error connecting to stream provider.</p>'; }
        }

        function closeOverlay() { overlay.style.display = 'none'; }
    </script>
</body>
</html>
