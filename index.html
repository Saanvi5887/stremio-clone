<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Sync Pro | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0f12;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-soft: #b8c1ec;
            --text-main: #eef1f5;
            --text-dim: #a0a0a8;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Ambient Background Glow */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--accent-soft);
            filter: blur(150px);
            opacity: 0.05;
            z-index: -1;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent-soft);
            background: rgba(255, 255, 255, 0.08);
        }

        .primary-btn {
            width: 100%;
            background: var(--accent-soft);
            color: #232946;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .primary-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(184, 193, 236, 0.2);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .footer-note i {
            color: var(--accent-soft);
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Party Sync Pro</h1>
        <p>Enter a movie title or IMDB ID to start your private watch party.</p>
        
        <form action="/search" method="GET">
            <div class="search-box">
                <input type="text" name="query" placeholder="e.g. Inception or tt0848228" required>
            </div>
            <button type="submit" class="primary-btn">
                <i class="fas fa-search"></i> Find Movie
            </button>
        </form>

        <div class="footer-note">
            <i class="fas fa-shield-halved"></i> Private & Encrypted Room
        </div>
    </div>

</body>
</html>
