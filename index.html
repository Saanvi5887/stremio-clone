<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stremio Clone - Lobby</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        
        body { 
            background: radial-gradient(circle at top, #0a0f0d 0%, #050505 100%); 
            color: #e0e0e0; 
            font-family: 'Inter', sans-serif; 
            padding: 40px; 
            margin: 0; 
            min-height: 100vh; 
        }
        
        h1 { 
            text-align: center; 
            color: #00ff88; 
            font-size: 3rem; 
            text-transform: uppercase; 
            letter-spacing: 8px; 
            margin-bottom: 50px; 
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3); 
        }
        
        .controls-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 40px; 
        }
        
        .input-group { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
        }
        
        input { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid #444; 
            color: white; 
            padding: 12px 20px; 
            border-radius: 30px; 
            outline: none; 
            width: 200px; 
            margin-right: 10px;
        }
        
        button { 
            padding: 12px 25px; 
            border-radius: 30px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            background: #00ff88; 
            color: black; 
            transition: 0.2s; 
        }
        
        button:hover { 
            background: #00cc6e; 
            transform: scale(1.05); 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 35px; 
        }
        
        .card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        
        .card:hover { 
            transform: translateY(-10px); 
            border-color: #00ff88; 
        }
        
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card h3 { padding: 15px; font-size: 0.9rem; text-align: center; color: #fff; margin: 0; }

        /* Stream Modal */
        #stream-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #111;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #00ff88;
        }
        .stream-item {
            background: #222;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .stream-item:hover { background: #00ff88; color: #000; }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h1>STREMIO CLONE</h1>
    
    <div class="controls-container">
        <div class="input-group">
            <input type="text" id="room-input" placeholder="Enter Room ID">
            <button onclick="createPrivateRoom()">Create Private Room</button>
            <p id="room-status" style="font-size: 0.8rem; color: #888; margin-top: 10px;">Not in a room</p>
        </div>
    </div>

    <div id="movie-grid" class="grid">Loading real movies...</div>

    <div id="stream-modal">
        <div class="modal-content">
            <h2 id="modal-title">Select Stream</h2>
            <div id="stream-list"></div>
            <button onclick="closeModal()" style="background:#555; color:white; margin-top:20px;">Close</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = null;

        function joinRoom() {
            currentRoom = document.getElementById('room-input').value.trim();
            if (!currentRoom) return alert("Enter Room ID");
            socket.emit('join-room', currentRoom);
            document.getElementById('room-status').innerText = "Connected to: " + currentRoom;
            document.getElementById('room-status').style.color = "#00ff88";
        }

        async function loadMovies() {
            try {
                const res = await fetch('/trending');
                const movies = await res.json();
                const grid = document.getElementById('movie-grid');
                grid.innerHTML = '';
                movies.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => fetchStreams(m.id, m.title);
                    card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${m.poster_path}"><h3>${m.title}</h3>`;
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('movie-grid').innerHTML = "Error loading movies. Check backend console.";
            }
        }

        async function fetchStreams(tmdbId, title) {
            document.getElementById('stream-modal').style.display = 'flex';
            const list = document.getElementById('stream-list');
            list.innerHTML = "Searching Torrentio...";

            try {
                // Get IMDB ID first
                const tmdbRes = await fetch(`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=d800759469a13ad76fd7f48830a046a8`);
                const data = await tmdbRes.json();
                const imdbId = data.imdb_id;

                const streamRes = await fetch(`/streams/${imdbId}`);
                const streams = await streamRes.json();
                
                list.innerHTML = '';
                streams.slice(0, 5).forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'stream-item';
                    item.innerHTML = `<strong>${s.name}</strong><br><small>${s.title.split('\n')[0]}</small>`;
                    item.onclick = () => {
                        if (!currentRoom) return alert("Join a room first!");
                        socket.emit('play-movie', { 
                            roomId: currentRoom, 
                            infoHash: s.infoHash, 
                            title: title,
                            imdb: imdbId 
                        });
                    };
                    list.appendChild(item);
                });
            } catch (e) { list.innerHTML = "Error fetching streams."; }
        }

        socket.on('start-stream', (data) => {
            // Send everyone to the player page
            window.location.href = `/player?hash=${data.infoHash}&title=${encodeURIComponent(data.title)}&room=${currentRoom}&imdb=${data.imdb}`;
        });

        function closeModal() { document.getElementById('stream-modal').style.display = 'none'; }
        
        loadMovies();

        // Add this function inside your <script> in index.html
async function createPrivateRoom() {
    const res = await fetch('/generate-room');
    const data = await res.json();
    document.getElementById('room-input').value = data.roomId;
    joinRoom();
}
    </script>
</body>
</html>
