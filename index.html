<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Sync Pro | Discover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f0f12; --card: rgba(255, 255, 255, 0.03); --accent: #b8c1ec; --text: #eef1f5; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        
        .header { margin: 40px 0 20px; text-align: center; }
        h1 span { color: var(--accent); }

        .search-box { 
            width: 100%; max-width: 600px; display: flex; background: var(--card); 
            padding: 8px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); 
            margin-bottom: 40px; backdrop-filter: blur(10px);
        }
        input { flex: 1; background: transparent; border: none; padding: 12px; color: #fff; outline: none; font-size: 16px; }
        .search-btn { background: var(--accent); color: #232946; border: none; padding: 10px 25px; border-radius: 12px; font-weight: 700; cursor: pointer; }

        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 25px; width: 100%; max-width: 1200px; }
        .movie-card { background: var(--card); border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; position: relative; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .info { padding: 10px; text-align: center; background: rgba(0,0,0,0.8); position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
        .title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(10,10,12,0.98); backdrop-filter: blur(20px); z-index: 1000; padding: 50px 20px; box-sizing: border-box; overflow-y: auto; }
        .overlay-content { max-width: 700px; margin: 0 auto; position: relative; }
        .close-btn { position: sticky; top: 0; float: right; font-size: 30px; cursor: pointer; color: var(--accent); z-index: 10; }
        
        .stream-card { 
            background: rgba(255,255,255,0.05); margin-bottom: 12px; padding: 18px; 
            border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; 
            transition: 0.2s;
        }
        .stream-card:hover { border-color: var(--accent); background: rgba(184, 193, 236, 0.08); transform: scale(1.01); }
    </style>
</head>
<body>

    <div class="header"><h1>Party Sync <span>Pro</span></h1></div>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Search movies or shows..." onkeyup="if(event.key==='Enter') search()">
        <button class="search-btn" onclick="search()">Search</button>
    </div>

    <div class="results-grid" id="grid"></div>

    <div id="overlay">
        <div class="overlay-content">
            <span class="close-btn" onclick="closeOverlay()">&times;</span>
            <h2 id="m-title" style="text-align:center; margin-bottom:30px; color: var(--accent);"></h2>
            <div id="streams"></div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const streamsDiv = document.getElementById('streams');

        async function init() {
            grid.innerHTML = "<p>Loading trending content...</p>";
            try {
                const res = await fetch('https://v3-cinemeta.strem.io/catalog/movie/top.json');
                const data = await res.json();
                render(data.metas);
            } catch(e) { grid.innerHTML = "<p>Failed to load grid.</p>"; }
        }

        async function search() {
            const q = document.getElementById('query').value;
            if(!q) return;
            grid.innerHTML = '<p>Searching...</p>';
            try {
                const res = await fetch(`https://v3-cinemeta.strem.io/catalog/movie/top/search=${encodeURIComponent(q)}.json`);
                const data = await res.json();
                render(data.metas);
            } catch(e) { grid.innerHTML = '<p>Search error.</p>'; }
        }

        function render(movies) {
            grid.innerHTML = '';
            movies.forEach(m => {
                const div = document.createElement('div');
                div.className = 'movie-card';
                div.onclick = () => getLinks(m.imdb_id, m.name, m.type);
                div.innerHTML = `<img class="poster" src="${m.poster}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'"><div class="info"><div class="title">${m.name}</div></div>`;
                grid.appendChild(div);
            });
        }

        async function getLinks(id, name, type) {
            document.getElementById('m-title').innerText = name;
            document.getElementById('overlay').style.display = 'block';
            streamsDiv.innerHTML = '<div style="text-align:center; padding: 20px;">🚀 Bypassing blocks via server tunnel...</div>';

            const cleanId = id.startsWith('tt') ? id : `tt${id}`;
            let targetUrl = `https://torrentio.strem.io/stream/${type}/${cleanId}.json`;

            if (type === 'series') {
                const s = prompt("Season?", "1") || "1";
                const e = prompt("Episode?", "1") || "1";
                targetUrl = `https://torrentio.strem.io/stream/series/${cleanId}:${s}:${e}.json`;
            }

            try {
                // Calls YOUR Render server
                const response = await fetch(`/fetch-links?url=${encodeURIComponent(targetUrl)}`);
                
                if (!response.ok) throw new Error(`Server status: ${response.status}`);
                
                const data = await response.json();
                streamsDiv.innerHTML = '';

                if (!data.streams || data.streams.length === 0) {
                    streamsDiv.innerHTML = '<p style="text-align:center;">No links found. Torrentio might not have this file yet.</p>';
                    return;
                }

                data.streams.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'stream-card';
                    card.onclick = () => {
                        window.location.href = `/player.html?videoUrl=${encodeURIComponent(s.url)}&title=${encodeURIComponent(name)}`;
                    };
                    
                    const titleParts = s.title.split('\n');
                    card.innerHTML = `
                        <div style="flex:1; padding-right: 10px;">
                            <div style="font-weight:700; margin-bottom:4px;">${s.name}</div>
                            <div style="font-size:12px; color:#aaa; line-height:1.4;">${titleParts[1] || titleParts[0]}</div>
                        </div>
                        <i class="fas fa-play-circle" style="font-size: 24px; color: var(--accent);"></i>
                    `;
                    streamsDiv.appendChild(card);
                });
            } catch (err) {
                console.error("Tunnel Failure:", err);
                streamsDiv.innerHTML = `<div style="text-align:center; color:#ff8080; padding: 20px;">
                    <b>Tunnel Failure</b><br>${err.message}<br>
                    <small>Check your Render logs to see if index.js is crashing.</small>
                </div>`;
            }
        }

        function closeOverlay() { document.getElementById('overlay').style.display = 'none'; }
        init();
    </script>
</body>
</html>
