<!DOCTYPE html>
<html>
<head>
    <title>Debug Mode | Party Sync</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; }
        .movie-btn { padding: 10px; margin: 5px; background: #333; border: 1px solid #555; color: #fff; cursor: pointer; }
        .link-card { background: #222; padding: 10px; margin: 10px 0; border-left: 5px solid #b8c1ec; }
    </style>
</head>
<body>
    <h1>Debug: Step Two</h1>
    <p>Click a button to test the server tunnel:</p>
    
    <button class="movie-btn" onclick="testLinks('tt0468569', 'The Dark Knight', 'movie')">Test Movie (Dark Knight)</button>
    <button class="movie-btn" onclick="testLinks('tt0944947', 'Game of Thrones', 'series')">Test Series (GoT S1 E1)</button>

    <div id="status"></div>
    <div id="results"></div>

    <script>
        async function testLinks(id, name, type) {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            
            status.innerText = `Fetching ${name}...`;
            results.innerHTML = '';

            let url = `https://torrentio.strem.io/stream/${type}/${id}.json`;
            if(type === 'series') url = `https://torrentio.strem.io/stream/series/${id}:1:1.json`;

            try {
                // This calls your /fetch-links route in index.js
                const res = await fetch(`/fetch-links?url=${encodeURIComponent(url)}`);
                const data = await res.json();

                if (!data.streams || data.streams.length === 0) {
                    status.innerText = "No streams found. Your tunnel works, but the addon returned nothing.";
                    return;
                }

                status.innerText = `Success! Found ${data.streams.length} links.`;
                data.streams.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'link-card';
                    div.innerHTML = `<b>${s.name}</b><br>${s.title}`;
                    results.appendChild(div);
                });
            } catch (err) {
                status.innerText = "Tunnel Error: Check if your server is actually running.";
            }
        }
    </script>
</body>
</html>
